<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VYROVA Mini Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one full-bleed canvas stage; a three-column HUD (hearts / score / pause) floats over it; overlays fade in for start, pause and game over. */
:root {
  --ink: #04030c;
  --navy: #0a1030;
  --violet: #a24bff;
  --blue: #2f7bff;
  --cyan: #3df2ff;
  --hot: #ff3fa4;
  --text: #eaf2ff;
  --dim: #8fa0d6;
  --font: 'Chakra Petch', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font);
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--ink); }

#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + var(--tgtop, 0px) + 10px) 16px 0;
  pointer-events: none; opacity: 0; transition: opacity .4s ease;
}
#hud::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 110px; z-index: -1;
  background: linear-gradient(to bottom, rgba(4,3,12,.62), rgba(4,3,12,0));
}
body[data-mode="play"] #hud, body[data-mode="pause"] #hud, body[data-mode="dying"] #hud { opacity: 1; }
#left { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
#lives { display: flex; gap: 4px; align-items: center; min-height: 40px; }
#coins { display: flex; align-items: center; gap: 7px; height: 18px; font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--cyan); text-shadow: 0 0 8px rgba(61,242,255,.7); font-variant-numeric: tabular-nums; }
#coins i { width: 8px; height: 8px; transform: rotate(45deg); border-radius: 2px; background: linear-gradient(135deg, #d9fdff, var(--cyan)); box-shadow: 0 0 8px var(--cyan); }
#coins b { display: inline-block; font-weight: 700; }
#coins.pop b { animation: hp .3s ease; }
.coinline { font-size: 15px; font-weight: 700; letter-spacing: .16em; color: var(--cyan); text-shadow: 0 0 12px rgba(61,242,255,.7); font-variant-numeric: tabular-nums; }
.h { width: 22px; height: 22px; transition: transform .25s ease; }
.h.full { fill: var(--hot); filter: drop-shadow(0 0 5px rgba(255,63,164,.8)); }
.h.empty { fill: none; stroke: rgba(255,63,164,.4); stroke-width: 1.6; }
.h.pop { animation: hp .4s ease; }
@keyframes hp { 0% { transform: scale(1.7); } 100% { transform: scale(1); } }
#scoreWrap { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 96px; }
#score {
  font-size: 30px; font-weight: 700; letter-spacing: .06em; line-height: 40px; font-variant-numeric: tabular-nums;
  color: #fff; text-shadow: 0 0 12px rgba(61,242,255,.7), 0 0 28px rgba(162,75,255,.5);
}
#combo { display: flex; flex-direction: column; align-items: center; gap: 3px; opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s; }
#combo.on { opacity: 1; transform: none; }
#mult { font-size: 15px; font-weight: 700; letter-spacing: .14em; color: var(--cyan); text-shadow: 0 0 10px rgba(61,242,255,.8); font-variant-numeric: tabular-nums; }
#mult b { color: var(--dim); font-weight: 500; font-size: 11px; margin-left: 6px; letter-spacing: .12em; }
#cbarWrap { width: 74px; height: 3px; border-radius: 2px; background: rgba(143,160,214,.2); overflow: hidden; }
#cbar { display: block; height: 100%; width: 100%; transform-origin: left; background: linear-gradient(90deg, var(--violet), var(--cyan)); }
#pauseBtn {
  justify-self: end; width: 40px; height: 40px; border-radius: 12px; padding: 0;
  display: grid; place-items: center; cursor: pointer; pointer-events: none;
  background: rgba(10,16,48,.55); border: 1px solid rgba(61,242,255,.35); color: var(--text);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
body[data-mode="play"] #pauseBtn { pointer-events: auto; }
#pauseBtn svg { width: 16px; height: 16px; fill: currentColor; }
#pauseBtn:focus-visible, .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

.ov {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 16px; box-sizing: border-box; text-align: center;
  background: rgba(3,2,12,.58); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity .35s ease;
}
.ov.show { opacity: 1; pointer-events: auto; }
/* ---------- Start screen ---------- */
#ovStart {
  justify-content: flex-start; align-items: stretch; text-align: center; overflow: hidden;
  padding: calc(env(safe-area-inset-bottom, 0px) * 0 + env(safe-area-inset-top, 0px) + var(--tgtop, 0px) + 12px) 18px calc(env(safe-area-inset-bottom, 0px) + 20px);
  background: none; backdrop-filter: none; -webkit-backdrop-filter: none; transition: opacity .45s ease;
}
#ovStart > * { position: relative; z-index: 1; }
.st-bg { position: absolute !important; inset: 0; z-index: 0 !important; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(120% 55% at 50% -8%, rgba(120,70,255,.42), transparent 62%),
    radial-gradient(90% 50% at 108% 52%, rgba(47,123,255,.26), transparent 60%),
    radial-gradient(80% 46% at -12% 44%, rgba(255,63,164,.16), transparent 62%),
    linear-gradient(to bottom, rgba(4,3,12,.55), rgba(4,3,12,.08) 45%, rgba(4,3,12,.6)); }
.st-grid { position: absolute; left: -40%; right: -40%; bottom: -6%; height: 46%; transform: perspective(320px) rotateX(64deg); transform-origin: 50% 100%;
  background-image: linear-gradient(rgba(61,242,255,.42) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(162,75,255,.42) 1.5px, transparent 1.5px);
  background-size: 54px 54px; animation: gridMove 2.4s linear infinite;
  -webkit-mask-image: linear-gradient(to top, #000 15%, transparent 92%); mask-image: linear-gradient(to top, #000 15%, transparent 92%); opacity: .75; }
@keyframes gridMove { to { background-position: 0 54px, 54px 0; } }
.st-vig { position: absolute; inset: 0; background: radial-gradient(130% 90% at 50% 45%, transparent 55%, rgba(2,1,8,.7)); }
.st-top { display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; padding: 0; display: grid; place-items: center; cursor: pointer; color: var(--text);
  background: rgba(10,16,48,.55); border: 1px solid rgba(61,242,255,.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform .12s ease; }
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.exit { margin: 0; }
.best-chip { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: #fff; background: rgba(10,16,48,.55); border: 1px solid rgba(162,75,255,.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-variant-numeric: tabular-nums; }
.best-chip::before { content: ""; width: 9px; height: 9px; transform: rotate(45deg); border-radius: 2px; background: linear-gradient(135deg, #fff, var(--cyan)); box-shadow: 0 0 8px var(--cyan); }
.st-hero { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: clamp(4px, 2.5vh, 22px); }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .42em; margin-left: .42em; color: var(--dim); text-transform: uppercase; }
#ovStart .logo { font-size: clamp(44px, 16.5vw, 72px); position: relative; }
#ovStart .logo::after { content: ""; position: absolute; inset: -4px -10%; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.75) 50%, transparent 62%); background-size: 260% 100%; background-position: 130% 0; mix-blend-mode: overlay; animation: logoSheen 5.5s ease-in-out 1.2s infinite; -webkit-background-clip: text; background-clip: text; }
@keyframes logoSheen { 0%, 55% { background-position: 130% 0; } 100% { background-position: -40% 0; } }
.st-rings { position: absolute !important; left: 50%; top: 47%; width: min(78vw, 300px); aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; z-index: 0 !important; }
.st-rings i { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(61,242,255,.3); }
.st-rings i:nth-child(1) { inset: 10%; border-style: dashed; border-color: rgba(162,75,255,.5); animation: spin 22s linear infinite; }
.st-rings i:nth-child(2) { inset: 26%; border-color: rgba(61,242,255,.4); box-shadow: 0 0 30px rgba(61,242,255,.18), inset 0 0 30px rgba(162,75,255,.14); animation: pulseRing 3.4s ease-in-out infinite; }
.st-rings i:nth-child(3) { inset: -4%; border-color: rgba(47,123,255,.2); animation: spin 40s linear infinite reverse; border-style: dotted; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulseRing { 0%, 100% { transform: scale(.96); opacity: .7; } 50% { transform: scale(1.04); opacity: 1; } }
.st-info { display: flex; flex-direction: column; gap: 10px; margin: auto 0 14px; }
.reward-card { position: relative; border-radius: 20px; padding: 14px 16px 14px; text-align: left; overflow: hidden;
  background: linear-gradient(150deg, rgba(36,22,92,.78), rgba(10,16,48,.72)); border: 1px solid rgba(143,160,214,.28);
  box-shadow: 0 18px 40px -18px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.reward-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent); }
.rc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 11px; font-weight: 700; letter-spacing: .24em; color: var(--dim); text-transform: uppercase; }
.rc-total { display: inline-flex; align-items: baseline; gap: 5px; font-size: 22px; letter-spacing: .02em; color: #fff; text-shadow: 0 0 14px rgba(61,242,255,.7); font-variant-numeric: tabular-nums; }
.rc-total small { font-size: 10px; letter-spacing: .2em; color: var(--cyan); }
.rc-row { display: flex; align-items: center; gap: 11px; padding: 8px 0; border-top: 1px solid rgba(143,160,214,.16); }
.rc-ic { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: rgba(61,242,255,.1); border: 1px solid rgba(61,242,255,.35); }
.rc-ic.boss { background: rgba(255,63,164,.12); border-color: rgba(255,63,164,.45); }
.rc-ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--cyan); }
.rc-ic.boss svg { color: var(--hot); }
.rc-txt { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; letter-spacing: .04em; color: var(--text); line-height: 1.2; }
.rc-txt small { display: block; margin-top: 2px; font-size: 11px; font-weight: 500; letter-spacing: .04em; color: var(--dim); }
.rc-val { flex: none; font-size: 16px; font-weight: 700; letter-spacing: .04em; color: var(--cyan); text-shadow: 0 0 10px rgba(61,242,255,.6); font-variant-numeric: tabular-nums; }
.rc-row.boss .rc-val { color: #ff8fcd; text-shadow: 0 0 10px rgba(255,63,164,.6); }
.howto { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.howto div { padding: 9px 4px; border-radius: 14px; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; background: rgba(10,16,48,.5); border: 1px solid rgba(143,160,214,.2); line-height: 1.25; }
.howto b { display: block; font-size: 15px; color: #fff; letter-spacing: .02em; margin-bottom: 2px; }
.st-cta { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.btn.cta { position: relative; overflow: hidden; width: 100%; max-width: 360px; min-height: 58px; border-radius: 18px; font-size: 17px; letter-spacing: .3em; text-indent: .3em;
  background: linear-gradient(120deg, #8a3cff, #3b6bff 55%, #19c6ff); border: 1px solid rgba(255,255,255,.35);
  box-shadow: 0 0 0 1px rgba(61,242,255,.2), 0 10px 34px -6px rgba(110,80,255,.75), inset 0 1px 0 rgba(255,255,255,.4); animation: ctaGlow 2.6s ease-in-out infinite; }
.btn.cta::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%); transform: translateX(-120%); animation: ctaSheen 3.6s ease-in-out 1s infinite; }
@keyframes ctaGlow { 0%, 100% { box-shadow: 0 0 0 1px rgba(61,242,255,.2), 0 10px 30px -8px rgba(110,80,255,.6), inset 0 1px 0 rgba(255,255,255,.4); } 50% { box-shadow: 0 0 0 1px rgba(61,242,255,.4), 0 12px 42px -4px rgba(61,160,255,.85), inset 0 1px 0 rgba(255,255,255,.4); } }
@keyframes ctaSheen { 0%, 40% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.st-note { font-size: 11.5px; letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }
.st-note i { display: inline-block; width: 4px; height: 4px; margin: 0 8px 2px; border-radius: 50%; background: var(--dim); }
#ovStart .st-top, #ovStart .st-hero, #ovStart .st-info, #ovStart .st-cta { opacity: 0; transform: translateY(14px); }
#ovStart.show .st-top, #ovStart.show .st-hero, #ovStart.show .st-info, #ovStart.show .st-cta { animation: stIn .6s cubic-bezier(.2,.8,.2,1) forwards; }
#ovStart.show .st-hero { animation-delay: .05s; } #ovStart.show .st-info { animation-delay: .18s; } #ovStart.show .st-cta { animation-delay: .3s; }
@keyframes stIn { to { opacity: 1; transform: none; } }
@media (max-height: 700px) { .howto { display: none; } .st-info { margin-bottom: 8px; } .rc-row { padding: 6px 0; } .eyebrow { display: none; } }
@media (max-height: 600px) { .st-rings { display: none; } }
@media (prefers-reduced-motion: reduce) { .st-grid, .st-rings i, #ovStart .logo::after, .btn.cta, .btn.cta::after { animation: none !important; } #ovStart .st-top, #ovStart .st-hero, #ovStart .st-info, #ovStart .st-cta { opacity: 1; transform: none; animation: none !important; } }
.panel { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 100%; transform: translateY(14px) scale(.98); transition: transform .4s cubic-bezier(.2,.8,.2,1); }
.ov.show .panel { transform: none; }
.logo {
  font-size: clamp(40px, 15vw, 66px); font-weight: 700; letter-spacing: .14em; margin: 0 0 0 .14em; line-height: 1;
  background: linear-gradient(100deg, var(--cyan), var(--blue) 45%, var(--violet));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(47,123,255,.55));
}
.tag {
  font-size: 13px; font-weight: 600; letter-spacing: .5em; margin-left: .5em; color: var(--text);
  padding: 5px 12px; border: 1px solid rgba(162,75,255,.6); border-radius: 999px; background: rgba(162,75,255,.12);
}
.hint { margin: 4px 0 6px; font-size: 14px; line-height: 1.5; color: var(--dim); letter-spacing: .04em; max-width: 26ch; text-wrap: balance; }
h2 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: .2em; margin-left: .2em; color: #fff; text-shadow: 0 0 18px rgba(162,75,255,.8); }
.big { font-size: 52px; font-weight: 700; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(61,242,255,.7), 0 0 38px rgba(162,75,255,.5); }
.best { font-size: 13px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; font-variant-numeric: tabular-nums; }
.badge { font-size: 12px; font-weight: 700; letter-spacing: .3em; padding: 4px 10px; border-radius: 999px; color: var(--ink); background: var(--cyan); box-shadow: 0 0 16px rgba(61,242,255,.7); }
.btn {
  min-height: 52px; min-width: 200px; padding: 0 28px; border-radius: 14px; cursor: pointer;
  font-family: var(--font); font-size: 15px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--text);
  background: linear-gradient(135deg, rgba(162,75,255,.32), rgba(47,123,255,.32));
  border: 1px solid rgba(61,242,255,.55); box-shadow: 0 0 22px rgba(47,123,255,.3), inset 0 0 14px rgba(61,242,255,.1);
  transition: transform .12s ease, box-shadow .2s ease;
}
.btn:active { transform: scale(.96); }
.btn.primary { background: linear-gradient(135deg, rgba(162,75,255,.75), rgba(47,123,255,.75)); box-shadow: 0 0 30px rgba(162,75,255,.5), inset 0 0 16px rgba(255,255,255,.15); }
.btn.ghost { min-height: 44px; font-size: 13px; background: rgba(10,16,48,.5); border-color: rgba(143,160,214,.35); box-shadow: none; }
.stack { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 4px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .panel, .ov, #hud, #combo { transition: none; } .h.pop { animation: none; } }
.exit{margin-top:10px}
.exit[hidden]{display:none}
</style>
</head>
<body>

<canvas id="c" aria-label="VYROVA Mini Bot game field"></canvas>

<div id="hud">
  <div id="left">
    <div id="lives" aria-label="Lives"></div>
    <div id="coins" aria-label="VYRO COIN"><i></i><b id="coinN">0</b></div>
  </div>
  <div id="scoreWrap">
    <div id="score">0</div>
    <div id="combo"><div id="mult">×1</div><div id="cbarWrap"><i id="cbar"></i></div></div>
  </div>
  <button id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.4" height="12" rx="1.2"/><rect x="9.6" y="2" width="3.4" height="12" rx="1.2"/></svg></button>
</div>

<section class="ov show" id="ovStart">
  <div class="st-bg" aria-hidden="true"><div class="st-grid"></div><div class="st-vig"></div></div>
  <div class="st-rings" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="st-top">
    <button class="icon-btn exit" data-exit hidden aria-label="Back to Earn"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="best-chip" id="bestStart" hidden></div>
  </div>
  <div class="st-hero">
    <div class="eyebrow">Arcade · Boss Run</div>
    <h1 class="logo">VYROVA</h1>
    <div class="tag">MINI BOT</div>
  </div>
  <div class="st-info">
    <div class="reward-card">
      <div class="rc-head"><span>VYRO COIN reward</span><span class="rc-total">200<small>MAX</small></span></div>
      <div class="rc-row">
        <div class="rc-ic"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.7 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/></svg></div>
        <div class="rc-txt">Reach the boss<small>Collected from enemies on the way</small></div>
        <div class="rc-val">+30</div>
      </div>
      <div class="rc-row boss">
        <div class="rc-ic boss"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg></div>
        <div class="rc-txt">Defeat the Warden<small>Only a real win pays out</small></div>
        <div class="rc-val">+170</div>
      </div>
    </div>
    <div class="howto"><div><b>Drag</b>to fly</div><div><b>Auto</b>fire</div><div><b>3 lives</b>no revives</div></div>
  </div>
  <div class="st-cta">
    <button class="btn primary cta" id="btnStart">Launch</button>
    <div class="st-note">Stay sharp<i></i>the boss waits</div>
  </div>
</section>

<section class="ov" id="ovPause">
  <div class="panel">
    <h2>PAUSED</h2>
    <div class="stack">
      <button class="btn primary" id="btnResume">Resume</button>
      <button class="btn ghost" id="btnRestart">Restart</button>
      <button class="btn ghost" id="btnSound">Sound: On</button>
      <button class="btn ghost exit" data-exit hidden>Exit game</button>
    </div>
  </div>
</section>

<section class="ov" id="ovOver">
  <div class="panel">
    <h2 id="overTitle">BOT DOWN</h2>
    <div class="big" id="finalScore">0</div>
    <div class="coinline" id="coinsOver"></div>
    <div class="badge" id="newBest" hidden>NEW BEST</div>
    <div class="best" id="bestOver"></div>
    <div class="stack"><button class="btn primary" id="btnAgain">Fly again</button><button class="btn ghost exit" data-exit hidden>Back to Earn</button></div>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Telegram / platform ---------- */
let tg = window.Telegram && window.Telegram.WebApp;
try { if (!tg && window.parent !== window) tg = window.parent.Telegram && window.parent.Telegram.WebApp; } catch (e) {} /* embedded: reuse the host's Telegram haptics */
try {
  if (tg) {

/* ---------- Boss: the Warden ----------
   Phase 1 (fan, sweep, beam) until half health, then a short enrage beat and phase 2 (faster, adds rings,

  if (G.coinF < COIN_ENEMY_CAP) { const gain = COIN_ENEMY_CAP - Math.floor(G.coinF); G.coinF = COIN_ENEMY_CAP; if (gain > 0) popup(W / 2, H * .36, 'BOSS REACHED  +' + gain + ' VYRO COIN', '#3df2ff', 18); }

}

  if (B.hits % 3 === 0) tone(300, .05, 'square', .02, .6);
  if (B.hp <= 0) killBoss();

}
function startEnrage() {
  B.rage = true; B.state = 'enrage'; B.rt = 1.6; B.atk = null; eb.length = 0; banner('PHASE 2', '#ff4660', 2);
  shake(14); ring(B.x, B.y, B.r, B.r * 4, .7, 'red', 5); popup(B.x, B.y + B.r * 1.4, 'ENRAGED', '#ff7088', 22);
  noise(.7, .2, 500); tone(110, .8, 'sawtooth', .08, .5); hap('heavy');
}
function killBoss() {
  B.state = 'dead'; B.dt = 1.5; B.ex = 0; B.atk = null; eb.length = 0;
  G.bossAt = G.dif + 28; G.bossWarned = false;
  shake(14); hap('heavy');
}
/* Final Stand (last 20% health). The Warden raises an energy shield, which makes it immune, and drops two bullet

   Once the curtains have fallen the shield breaks for a few seconds: that is the window to deal damage. */
function startFinal() {
  B.final = true; B.atk = null; eb.length = 0; shake(12);
  banner('FINAL STAND', '#ff4660', 2.2); noise(.6, .18, 500); tone(100, .9, 'sawtooth', .08, .5); hap('heavy');
  beginCharge();
}
function beginCharge() {
  const b = B; b.fs = 'charge'; b.ft = 0; b.shield = true; b.atk = null; b.row = 0;
  const gw = (G.dif >= 75 ? 104 : 120) * S, lo = 16 + gw / 2, hi = W - 16 - gw / 2;
  const a = rand(lo, hi), a2 = clamp(a + (Math.random() < .5 ? -1 : 1) * rand(60, 140) * S, lo, hi);

}
function curtainRow(b, lanes, k) {
  const step = 26 * S, spd = (200 + 30 * (tab(G.dif, D_AGGR) * (b.rage ? P2_AG : 1) - 1)) * V;

function pickAtk(b, ag) {

    if (b.rage) {

function endAtk(b, ag) { b.atk = null; b.cd = Math.max(b.rage ? .45 : .6, (b.rage ? .8 : 1.8) / ag) * rand(.9, 1.1); if (b.rage && !b.final && Math.random() < P2_CHAIN) b.cd = .2; /* phase 2 chains attacks */ }

function updateBoss(d) {

  if (b.state === 'dead') {
    b.dt -= d; b.ex -= d;
    if (b.ex <= 0) { b.ex = .12; burst(b.x + rand(-1, 1) * b.r, b.y + rand(-1, 1) * b.r * .8, 8, Math.random() < .5 ? 'hot' : 'violet', 240, .5, 4); shake(6); sfx.kill(); }
    if (b.dt <= 0) {
      const pts = 5000 * G.mult * (b.n + 1); addScore(pts);
      popup(b.x, b.y + b.r, '+' + pts.toLocaleString('en-US'), '#ffffff', 24); banner('WARDEN DOWN', '#3df2ff', 2);
      burst(b.x, b.y, 50, 'violet', 340, 1, 6); burst(b.x, b.y, 30, 'white', 260, .6, 5); ring(b.x, b.y, b.r, b.r * 5, .8, 'cyan', 5);
      for (let i = 0; i < 10; i++) spawnCore(b.x + rand(-60, 60) * S, b.y + rand(-20, 30) * S, rand(90, 150) * V);
      shake(20); sfx.over(); hap('success');
      G.bossCoins = COIN_BOSS; popup(b.x, b.y - b.r * .2, '+' + COIN_BOSS + ' VYRO COIN', '#3df2ff', 26);
      for (const e of E) burst(e.x, e.y, 10, 'violet', 240, .6, e.r * .3);

/* ---------- Game flow ---------- */
function resetWorld() {
  E = []; bullets = []; eb = []; pick = []; parts = []; rings = []; pops = []; B = null;
  Object.assign(G, { t: 0, dif: 0, score: 0, disp: 0, lives: 3, combo: 0, comboT: 0, mult: 1, shake: 0, flash: 0, slow: 1, warp: 1.2, dyT: 0, spawnT: .6, rockT: 4, streamT: 8, shots: 0, fireGap: 0, waveT: 6, q: [], coinF: 0, bossCoins: 0, victory: false, bossAt: 50, bossN: 0, bossWarned: false, extremeSeen: false, banner: null });
  Object.assign(P, { x: W / 2, y: H + 90, tx: W / 2, ty: H * .78, vx: 0, vy: 0, inv: 1.2, fireT: .3, alive: true });
  lastScoreTxt = ''; lastMult = 0; lastCoins = -1; renderLives(-1);
}
function startGame() { ac(); sfx.ui(); resetWorld(); if (typeof toHost === 'function' && EMBED) toHost({ type: 'run-start' }); showOv(null); setMode('play'); hap('medium'); }
function pauseGame() { if (G.mode !== 'play') return; setMode('pause'); showOv('ovPause'); sfx.ui(); drag = null; }
function resumeGame() { if (G.mode !== 'pause') return; ac(); sfx.ui(); showOv(null); setMode('play'); last = performance.now(); }
function showOv(id) {
  for (const o of ['ovStart', 'ovPause', 'ovOver']) $(o).classList.toggle('show', o === id);
}
function showOver() {
  setMode('over');
  const isBest = G.score > best;
  if (isBest) { best = G.score; saveBest(); }
  $('finalScore').textContent = G.score.toLocaleString('en-US');
  const coins = coinTotal();
  $('overTitle').textContent = G.victory ? 'VICTORY' : 'BOT DOWN';
  $('coinsOver').textContent = '+' + coins + ' VYRO COIN';

  try { window.dispatchEvent(new CustomEvent('vyrova:run-end', { detail: { coins, enemyCoins: Math.floor(G.coinF), bossCoins: G.bossCoins, score: G.score, victory: G.victory } })); } catch (e) {}
  $('newBest').hidden = !isBest;
  $('bestOver').textContent = 'Best ' + best.toLocaleString('en-US');

}

/* ---------- Host bridge (VYROVA app) ----------
   Standalone: does nothing. Embedded (?embed=1 inside the app's Earn › Games overlay):
   run-start / run-end / exit go to the parent via postMessage, and the server's verdict comes back
   as {vyrova:'claim-result'}. The game only REPORTS its result; the server decides what is paid. */
const EMBED = window.parent !== window && /[?&]embed=1/.test(location.search);
const toHost = m => { try { window.parent.postMessage(Object.assign({ vyrova: true }, m), location.origin); } catch (e) {} };
if (EMBED) {
  document.documentElement.classList.add('embed');
  document.querySelectorAll('[data-exit]').forEach(b => { b.hidden = false; b.addEventListener('click', () => { sfx.ui(); toHost({ type: 'exit' }); }); });
  window.addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || e.data.vyrova !== true) return;
    const d = e.data;
    if (d.type === 'pause') pauseGame();
    else if (d.type === 'claim-result') {
      const el = $('coinsOver');
      if (d.ok && d.reward > 0) { el.textContent = '+' + d.reward + ' VYRO COIN added'; hap('success'); }
      else if (d.ok && d.limitReached) el.textContent = 'Daily reward limit reached — come back tomorrow';
      else if (d.ok) el.textContent = 'No coins this run';
      else el.textContent = 'Reward not added (' + (d.error || 'error') + ')';
    }
  });
  window.addEventListener('vyrova:run-end', ev => toHost({ type: 'run-end', coins: ev.detail.coins, bossKilled: ev.detail.bossCoins > 0, score: ev.detail.score, victory: ev.detail.victory }));
}
$('btnStart').addEventListener('click', startGame);
$('btnAgain').addEventListener('click', startGame);
$('btnResume').addEventListener('click', resumeGame);
$('btnRestart').addEventListener('click', startGame);
$('pauseBtn').addEventListener('click', pauseGame);
$('btnSound').addEventListener('click', () => { soundOn = !soundOn; saveSound(); $('btnSound').textContent = 'Sound: ' + (soundOn ? 'On' : 'Off'); if (soundOn) { ac(); sfx.ui(); } });
$('btnSound').textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
if (best > 0) { const b = $('bestStart'); b.hidden = false; b.textContent = 'Best ' + best.toLocaleString('en-US'); }
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* ---------- Input ---------- */
let drag = null;
cv.addEventListener('pointerdown', e => {
  if (G.mode !== 'play') return;

  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  e.preventDefault();

cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || G.mode !== 'play') return;
  P.tx = clamp(P.tx + (e.clientX - drag.x) * 1.25, 24, W - 24);
  P.ty = clamp(P.ty + (e.clientY - drag.y) * 1.25, H * .18, H - 56);

document.addEventListener('contextmenu', e => e.preventDefault());

  const k = e.key.toLowerCase(); keys[k] = true;
  if (k === 'escape' || k === 'p') { G.mode === 'play' ? pauseGame() : G.mode === 'pause' && resumeGame(); }
  if (k.startsWith('arrow')) e.preventDefault();

/* ---------- Update ---------- */
function update(dt) {
  G.clock += dt;
  G.slow += (1 - G.slow) * Math.min(1, dt * 2.5);
  const d = dt * G.slow, playing = G.mode === 'play', active = playing || G.mode === 'dying';
  if (active) G.t += d;
  if (playing) G.dif += dt / DIF_SCALE;   // difficulty clock: advances only during play, frozen while paused
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
  if (G.fireGap > 0) G.fireGap -= d;
  G.warp = Math.max(0, G.warp - dt * .9);
  G.flash = Math.max(0, G.flash - dt * 2.2);
  G.shake *= Math.exp(-dt * 9);
  if (P.inv > 0) P.inv -= d;

  const sm = (active ? 1 : .45) + G.warp * 6;
  for (const s of stars) { s.y += s.v * sm * d; if (s.y > H + 4) { s.y = -4; s.x = rand(0, W); } }

  /* player */
  if (playing && P.alive) {
    const ks = 520 * dt;
    if (keys['arrowleft'] || keys['a']) P.tx -= ks; if (keys['arrowright'] || keys['d']) P.tx += ks;
    if (keys['arrowup'] || keys['w']) P.ty -= ks; if (keys['arrowdown'] || keys['s']) P.ty += ks;
    P.tx = clamp(P.tx, 24, W - 24); P.ty = clamp(P.ty, H * .18, H - 56);
  }
  if (G.mode === 'start') { P.tx = W / 2; P.ty = H * .47 + Math.sin(G.clock * 1.6) * 6 * S; }
  if (P.alive) {
    const px = P.x, py = P.y, k = 1 - Math.exp(-dt * 18);
    P.x += (P.tx - P.x) * k; P.y += (P.ty - P.y) * k;

      ctx.strokeStyle = 'rgba(255,120,190,' + (.12 + wp * .3).toFixed(3) + ')'; ctx.lineWidth = 1.5; ctx.beginPath();
      for (let i = 0; i < cnt; i++) { const an = a.aim + (i - (cnt - 1) / 2) * gap; ctx.moveTo(ox, oy); ctx.lineTo(ox + Math.cos(an) * H * 1.2, oy + Math.sin(an) * H * 1.2); }
      ctx.stroke();
    }
  }
  ctx.save();
  const shk = b.state === 'enrage' ? 3 : 0;
  ctx.translate(b.x + rand(-shk, shk), b.y + rand(-shk, shk));
  if (b.state === 'dead') ctx.globalAlpha = .6 + .4 * Math.random();
  dg(col, 0, 0, r * 3.6, .45 + (.5 + .5 * Math.sin(t * 3)) * .15 + charge * .35);
  if (a && a.t < a.w && (a.k === 'sweep' || a.k === 'ring' || a.k === 'spiral' || a.k === 'burst')) {
    ctx.strokeStyle = 'rgba(255,120,190,' + (.2 + wp * .5).toFixed(2) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r * (2.6 - wp * 1.5), 0, TAU); ctx.stroke();
  }
  for (let i = 0; i < 6; i++) {
    ctx.save(); ctx.rotate(i / 6 * TAU + t * (rage ? 1.2 : .6));
    ctx.fillStyle = rage ? '#3a0c28' : '#241060'; ctx.strokeStyle = rage ? '#ff5470' : '#a24bff'; ctx.lineWidth = 2;
    rr(-r * .24, -r * 1.22, r * .48, r * .36, 5 * S); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  for (const sx of [-1, 1]) {
    const px = sx * r * 1.45, py = Math.sin(t * 2 + sx) * 5 * S + r * .15;
    dg('hot', px, py, r * (.7 + charge * .6), .4 + charge * .5);
    ctx.fillStyle = '#12082e'; ctx.strokeStyle = '#ff5cb8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, r * .24, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(162,75,255,.5)'; ctx.beginPath(); ctx.moveTo(sx * r * .9, 0); ctx.lineTo(px - sx * r * .24, py); ctx.stroke();
  }
  const g = ctx.createRadialGradient(-r * .3, -r * .35, 3, 0, 0, r);
  g.addColorStop(0, b.hit > 0 ? '#fff' : (rage ? '#b8284a' : '#6a32d8')); g.addColorStop(1, rage ? '#2a0516' : '#13062f');
  ctx.fillStyle = g; ctx.strokeStyle = rage ? '#ff7088' : '#c58bff'; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.rotate(-t * 1.1); ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2; ctx.setLineDash([r * .3, r * .22]);
  ctx.beginPath(); ctx.arc(0, 0, r * .82, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  const dx = P.x - b.x, dy = P.y - b.y, m = Math.hypot(dx, dy) || 1, er = r * .5, o = er * .35, ey = r * .04;
  ctx.fillStyle = '#12031f'; ctx.beginPath(); ctx.ellipse(0, ey, er, er * .72, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = rage ? '#ff3a52' : '#ff3fa4'; ctx.beginPath(); ctx.arc(dx / m * o, ey + dy / m * o * .7, er * .46, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(dx / m * o - 2, ey + dy / m * o * .7 - 2, er * .15, 0, TAU); ctx.fill();
  if (rage) { ctx.strokeStyle = '#ff7088'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-er * 1.05, -er * .85); ctx.lineTo(-er * .1, -er * .3); ctx.moveTo(er * 1.05, -er * .85); ctx.lineTo(er * .1, -er * .3); ctx.stroke(); }
  if (b.shield) {
    const sp2 = .5 + .5 * Math.sin(G.clock * 6);
    dg('white', 0, 0, r * 2.6, .22 + .14 * sp2);
    ctx.strokeStyle = 'rgba(180,240,255,' + (.6 + .3 * sp2).toFixed(2) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, TAU); ctx.stroke();
    ctx.save(); ctx.rotate(G.clock * .8); ctx.strokeStyle = 'rgba(180,240,255,.45)'; ctx.lineWidth = 2; ctx.setLineDash([r * .4, r * .25]);
    ctx.beginPath(); ctx.arc(0, 0, r * 1.38, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  }
  ctx.restore();
}
function drawOverlays() {
  const live = G.mode === 'play' || G.mode === 'pause' || G.mode === 'dying';
  if (live && G.dif >= 75) { ctx.globalAlpha = .6 + .4 * Math.sin(G.clock * 3); ctx.fillStyle = extremeGrad; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (B && live) {
    const x0 = 16, w = W - 32, y = hudB + 4, h = 7, f = clamp(B.hp / B.max, 0, 1);
    ctx.fillStyle = 'rgba(10,16,48,.78)'; rr(x0, y, w, h, 3.5); ctx.fill();
    ctx.strokeStyle = B.rage ? 'rgba(255,112,136,.7)' : 'rgba(162,75,255,.6)'; ctx.lineWidth = 1; ctx.stroke();
    if (w * f > 3) {
      const g = ctx.createLinearGradient(x0, 0, x0 + w, 0);
      g.addColorStop(0, B.shield ? '#7fe8ff' : B.rage ? '#ff4660' : '#a24bff'); g.addColorStop(1, B.shield ? '#d9fdff' : '#ff3fa4');
      ctx.fillStyle = g; rr(x0, y, w * f, h, 3.5); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0 + w / 2, y - 1); ctx.lineTo(x0 + w / 2, y + h + 1);
    ctx.moveTo(x0 + w * .2, y - 1); ctx.lineTo(x0 + w * .2, y + h + 1); ctx.stroke();
    ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '600 10px "Chakra Petch", system-ui, sans-serif';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '2px';
    ctx.fillStyle = B.rage ? '#ff8aa0' : 'rgba(234,242,255,.8)'; ctx.fillText('WARDEN ' + ROMAN[Math.min(B.n, 4)] + (B.final ? (B.shield ? ' · SHIELDED' : ' · FINAL STAND') : B.rage ? ' · ENRAGED' : ''), x0, y + h + 10);
    ctx.restore();
  }
  if (G.banner) {
    const bn = G.banner, k = bn.t / bn.max, al = clamp(Math.min(k * 4, (1 - k) * 8), 0, 1) * (.78 + .22 * Math.sin(G.clock * 18));
    ctx.save(); ctx.globalAlpha = al; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(Math.min(34, W * .09)) + 'px "Chakra Petch", system-ui, sans-serif';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '6px';
    ctx.shadowColor = bn.col; ctx.shadowBlur = 18; ctx.fillStyle = bn.col; ctx.fillText(bn.text, W / 2, H * .34);
    ctx.restore();
  }
}
function drawPickup(c) {
  ctx.save(); ctx.translate(c.x, c.y);
  if (c.k === 'core') {
    const pulse = .7 + .3 * Math.sin(c.t * 7);
    dg('cyan', 0, 0, c.r * 3.2, .6 * pulse); ctx.scale(Math.abs(Math.cos(c.t * 3)) * .75 + .25, 1);
    ctx.fillStyle = '#d9fdff'; ctx.strokeStyle = '#3df2ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -c.r * 1.2); ctx.lineTo(c.r * .85, 0); ctx.lineTo(0, c.r * 1.2); ctx.lineTo(-c.r * .85, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (G.shake > .3) ctx.translate(rand(-1, 1) * G.shake, rand(-1, 1) * G.shake);
  drawBackground();
  for (const c of pick) drawPickup(c);
  for (const e of E) drawEnemy(e);
  if (B) drawBoss();
  /* projectiles are batched: one additive pass for glows, one path for all the cores */
  if (eb.length) {
    ctx.globalCompositeOperation = 'lighter';
    for (const b of eb) { const gr = b.r * 3.4; ctx.globalAlpha = .8 * (.75 + .25 * Math.sin(b.t * 20)); ctx.drawImage(GL.hot, b.x - gr, b.y - gr, gr * 2, gr * 2); }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.beginPath();
    for (const b of eb) { ctx.moveTo(b.x + b.r * .55, b.y); ctx.arc(b.x, b.y, b.r * .55, 0, TAU); }
    ctx.fill();
  }
  if (bullets.length) {
    const gr = 15 * S;
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .7;
    for (const b of bullets) ctx.drawImage(GL.cyan, b.x - gr, b.y - gr, gr * 2, gr * 2);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.strokeStyle = '#eaffff'; ctx.lineWidth = 3 * S; ctx.lineCap = 'round'; ctx.beginPath();
    for (const b of bullets) { ctx.moveTo(b.x - b.vx * .012, b.y + 14 * S); ctx.lineTo(b.x, b.y - 2 * S); }
    ctx.stroke();
  }
  if (P.alive) drawBot();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) { const k = p.life / p.max, pr = p.size * (1 + k) * 1.8; ctx.globalAlpha = k; ctx.drawImage(GL[p.key], p.x - pr, p.y - pr, pr * 2, pr * 2); }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.lineCap = 'butt';
  for (const r of rings) {
    const k = 1 - r.life / r.max, rad = r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - k, 3));
    ctx.strokeStyle = 'rgba(' + RGB[r.key] + ',' + (1 - k).toFixed(3) + ')'; ctx.lineWidth = r.w * (1 - k) + .5;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of pops) {
    const k = p.life / p.max, pin = clamp((1 - k) * 8, 0, 1), sc = .6 + .4 * pin + (k > .85 ? (k - .85) * 2 : 0);
    ctx.globalAlpha = clamp(k * 1.6, 0, 1); ctx.fillStyle = p.col;
    ctx.font = '700 ' + Math.round(p.size * sc) + 'px "Chakra Petch", system-ui, sans-serif';
    ctx.fillText(p.text, clamp(p.x, 50, W - 50), p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawOverlays();
  if (G.flash > .01) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .75);
    g.addColorStop(0, 'rgba(255,40,90,0)'); g.addColorStop(1, 'rgba(255,40,90,' + (G.flash * .5).toFixed(3) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- Loop ---------- */
let last = performance.now(), perfAcc = 0, perfN = 0;
function frame(now) {
  const raw = Math.min(.1, Math.max(0, (now - last) / 1000)), dt = Math.min(.033, raw); last = now;
  /* quality governor: if frames run long on a weak device, trim particle load; restore it when there is headroom */
  if (G.mode === 'play') {
    perfAcc += raw;
    if (++perfN >= 90) { const avg = perfAcc / perfN; if (avg > .026) Q = Math.max(.4, Q - .2); else if (avg < .019) Q = Math.min(1, Q + .1); perfAcc = 0; perfN = 0; }
  }
  if (G.mode !== 'pause') { update(dt); render(); }
  requestAnimationFrame(frame);
}
resize(); renderLives(-1); setMode('start'); P.alive = true;
requestAnimationFrame(frame);
})();
</script>
