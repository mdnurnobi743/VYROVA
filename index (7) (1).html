// PARTICLE BURST — lightweight canvas confetti for reward moments
// (claim lootbox, ad reward, task complete, withdraw, promo redeem).
// Self-contained, auto-clears after ~1s — never blocks interaction.
// ══════════════════════════════════════════════════════════════
const burstCanvas = document.getElementById('burst-canvas');
const burstCtx = burstCanvas.getContext('2d');
function resizeBurstCanvas() { burstCanvas.width = window.innerWidth; burstCanvas.height = window.innerHeight; }
resizeBurstCanvas();
window.addEventListener('resize', resizeBurstCanvas);

function triggerBurst(originEl) {
    const rect = originEl ? originEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
    const ox = rect.left + rect.width / 2;
    const oy = rect.top + rect.height / 2;
    const colors = ['#FFD24A', '#FF8A3D', '#FF3D81', '#FFF8F2'];
    const particles = Array.from({ length: 26 }, () => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 4.5;
        return { x: ox, y: oy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2, size: 3 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1 };
    });
    let frame = 0;
    function tick() {
        frame++;
        burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
        let alive = false;
        particles.forEach(p => {
            if (p.life <= 0) return;
            p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.life -= 0.022;
            if (p.life > 0) {
                alive = true;
                burstCtx.globalAlpha = Math.max(p.life, 0);
                burstCtx.fillStyle = p.color;
                burstCtx.beginPath(); burstCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); burstCtx.fill();
            }
        });
        burstCtx.globalAlpha = 1;
        if (alive && frame < 90) requestAnimationFrame(tick);
        else burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
    }
    tick();
}

// ══════════════════════════════════════════════════════════════
// COUNT-UP — animates a number from its current value to a new target
// ══════════════════════════════════════════════════════════════
function animateCountUp(el, from, to, duration = 700) {
    if (!el) return;
    const start = performance.now();
    const diff = to - from;
    function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = fmtWTC(from + diff * eased);
        if (t < 1) requestAnimationFrame(step);
        else el.textContent = fmtWTC(to);
    }
    requestAnimationFrame(step);
}

            const r = await apiPost('user', { action: 'acceptTerms', version: TERMS_VERSION_DISPLAY });
            if (!r || !r.ok) {
                done.disabled = !box.checked; done.textContent = 'I Agree & Start';
                toast(r && r.error === 'terms_outdated' ? errorText('terms_outdated') : 'Could not save your agreement — please try again.', 'error');
                return;
            }
            if (state.user) state.user.termsVersion = TERMS_VERSION_DISPLAY;
            triggerBurst(done);
            setTimeout(() => { document.getElementById('modal-root').innerHTML = ''; onDone(); }, 280);
        };
    }

    if (seenTicket) renderTerms(); else renderTicket();
}

// HISTORY — withdraw request status (received / pending only)
// ══════════════════════════════════════════════════════════════
const HISTORY_STATUS_UI = {
    pending:  { label: 'Pending',  icon: '🕓', color: 'var(--signal)' },
    approved: { label: 'Received', icon: '✅', color: 'var(--success)' },
};
async function openHistoryModal() {
    const root = document.getElementById('modal-root');
    root.innerHTML = `
        <div class="overlay">
            <div class="sheet" style="max-height:78vh; display:flex; flex-direction:column;">
                <div class="sheet-handle"></div>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
                    <div style="font-family:var(--font-display); font-weight:700; font-size:18px;">🕓 Withdraw History</div>
                    <button class="icon-btn" onclick="document.getElementById('modal-root').innerHTML=''" aria-label="Close">✕</button>
                </div>
                <div id="history-list" style="overflow-y:auto; flex:1;">
                    <div class="muted" style="text-align:center; padding:30px 0;">Loading...</div>
                </div>
            </div>
        </div>`;

    try {
        const r = await apiGet(`withdraw?action=history&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        const listEl = document.getElementById('history-list');
        if (!listEl) return; // modal closed before response arrived

        // ⚠️ FIX: previously r.history was filtered directly without checking
        // r.ok first — so any auth/server error silently showed "no requests"
        // instead, and the real cause was never visible. Errors are now shown
        // explicitly and separately.
        if (!r.ok) {
            console.error('history fetch failed:', r.error, r.reason);
            listEl.innerHTML = `<div class="muted" style="text-align:center; padding:30px 0;">Couldn't load history (${r.error || 'unknown'}). Close the app and reopen it.</div>`;
            return;
        }

        const items = (r.history || []).filter(h => h.status === 'pending' || h.status === 'approved');

        if (!items.length) {
            listEl.innerHTML = `<div class="muted" style="text-align:center; padding:30px 0;">No withdraw requests yet.</div>`;
            return;
        }

        listEl.innerHTML = items.map((h, i) => {
            const st = HISTORY_STATUS_UI[h.status] || { label: h.status, icon: '•', color: 'var(--ink-muted)' };
            const date = h.createdAt ? new Date(h.createdAt).toLocaleString() : '';
            return `
                <div class="card" style="margin-bottom:10px; opacity:0; animation: jg-rise 0.35s ease ${Math.min(i * 0.05, 0.4)}s forwards;">
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <div>
                            <div style="font-weight:700; font-size:15px;">$${Number(h.cashAmount ?? h.usdAmount ?? 0).toFixed(2)} ${h.currency || 'USDT'}</div>
                            <div class="muted" style="font-size:12px; margin-top:2px;">${(WITHDRAW_METHOD_LABELS[h.method] || h.method || '')} · ${date}</div>
                            ${h.status === 'pending' ? `<div class="muted" style="font-size:11px; margin-top:4px;">⏱ Expected within ${WITHDRAW_PROCESS_MIN_HOURS_DISPLAY}–${WITHDRAW_PROCESS_MAX_HOURS_DISPLAY} hours</div>` : ''}
                        </div>
                        <div style="display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; background:${st.color}22; color:${st.color}; font-size:12px; font-weight:700; white-space:nowrap;">
                            ${st.icon} ${st.label}
                        </div>
                    </div>
                </div>`;
        }).join('');
    } catch (e) {
        const listEl = document.getElementById('history-list');
        if (listEl) listEl.innerHTML = `<div class="muted" style="text-align:center; padding:30px 0;">Failed to load history.</div>`;
    }
}

// Shared promo-redeem flow (ad-gate -> claim), used by BOTH the inline Home
// promo box and the openPromoModal() popup, so the anti-abuse "must watch an
// ad before the code is spent" behavior can't drift out of sync between them.
async function redeemPromoCode(code, btn, onSuccess) {
    if (!code) return toast('Please enter a code.', 'error');
    const originalLabel = btn.textContent;
    btn.textContent = 'Checking code...'; btn.disabled = true;

    // ⚠️ NEW — validate the code BEFORE showing an ad. Previously the ad
    // played no matter what, so an invalid/expired/already-used code still
    // cost the user a full ad watch before telling them it failed. This
    // check doesn't spend the code (see handleCheckPromo in api/earn.js) —
    // the real, atomic redemption still happens after the ad, below.
    const check = await apiPost('earn', { action: 'checkPromo', code });
    if (!check.ok) {
        toast(errorText(check.error), 'error');
        btn.textContent = originalLabel; btn.disabled = false;
        return;
    }

    btn.textContent = 'Loading ad...';
    const candidates = [showAdsgramDailyAd, showGigaPubAd]; // ⚠️ Monetag removed from random ad picks (admin request: no Monetag in promo) // ⚠️ FIX — showAdsgramSpecialAd no longer exists (network removed); swapped in showGigaPubAd
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    try {
        await pick();
    } catch (e) {
        toast(errorText(e.message), 'error');
        btn.textContent = originalLabel; btn.disabled = false;
        return;
    }

    btn.textContent = 'Checking...';
    const r = await apiPost('earn', { action: 'claimPromo', code });
    if (r.ok) {
        toast(`+${r.reward} WTC added!`, 'success');
        triggerBurst(btn);
        showCongrats(`+${r.reward} WTC`, '🎁', `≈ $${wtcToUsd(r.reward)} USD`);
        await refreshUser();
        onSuccess?.();
    } else {
        toast(errorText(r.error), 'error');
    }
    btn.textContent = originalLabel; btn.disabled = false;
}

// ⚠️ CHANGED — Display-only mirror of lib/constants.js's SPIN_FREE_COOLDOWN_HOURS
// (was SPIN_DAILY_FREE, a daily count — now a rolling cooldown).
const SPIN_FREE_COOLDOWN_HOURS_DISPLAY = 2;
const SPIN_SEGMENTS_DISPLAY = [100, 10, 20, 30, 40, 50, 60, 80];
const SPIN_WHEEL_GRADIENT = 'conic-gradient(from 0deg, #F5B942 0deg 45deg, #E14D4D 45deg 90deg, #F0883E 90deg 135deg, #4ADE80 135deg 180deg, #22D3EE 180deg 225deg, #4F7CFF 225deg 270deg, #8B5CF6 270deg 315deg, #C026D3 315deg 360deg)';

// ⚠️ NEW — how many ms remain before the next free spin is available, based
// on u.lastFreeSpinAt (absent/null = never spun free before = available now).
function spinCooldownMsRemaining(u) {
    // ⚠️ CHANGED — one spin per 2h TOTAL (free or bonus), so use the latest of both timestamps
    const lastMs = Math.max(u.lastFreeSpinAt ? new Date(u.lastFreeSpinAt).getTime() : 0, u.lastSpinAt ? new Date(u.lastSpinAt).getTime() : 0);
    if (!lastMs) return 0;
    const elapsed = Date.now() - lastMs;
    return Math.max(0, SPIN_FREE_COOLDOWN_HOURS_DISPLAY * 60 * 60 * 1000 - elapsed);
}
function fmtCooldown(ms) {
    const totalMin = Math.ceil(ms / 60000);
    const h = Math.floor(totalMin / 60), m = totalMin % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

                    <div class="spin-wheel-pointer">▼</div>

                        ${wheelLabelsHtml}
                        <div class="spin-wheel-center">W</div>
                    </div>
                </div>
                <div id="spin-status" class="muted" style="font-size:12.5px; margin-bottom:14px;">
                    ${bonusSpins > 0
                        ? `🎁 ${bonusSpins} bonus spin${bonusSpins === 1 ? '' : 's'} saved from referrals${cooldownMs > 0 ? ` — next spin in ${fmtCooldown(cooldownMs)}` : ' — spin ready now'}`
                        : (cooldownMs > 0 ? `Next free spin in ${fmtCooldown(cooldownMs)}` : 'Free spin ready now!')}
                </div>
                <button class="btn" id="spin-now-btn" ${canSpin ? '' : 'disabled'} style="background:linear-gradient(120deg, #8B5CF6, #F5B942 130%); color:#fff; font-weight:700; font-size:15px; padding:0 24px; height:48px; ${canSpin ? '' : 'opacity:0.5;'}">
                    ${canSpin ? '🎬 Watch ad &amp; Spin' : `⏳ Next spin in ${fmtCooldown(cooldownMs)}`}
                </button>
            </div>
        </div>`;

    if (canSpin) document.getElementById('spin-now-btn').onclick = (e) => performSpin(e.currentTarget);
}

// ⚠️ CHANGED — now requests a signed spinStart token BEFORE showing the ad
// (same pattern as watchAdNetwork/claimLootbox) and carries it through to
// the `spin` claim. Previously `spin` had no token at all — see the
// security-fix note on SPIN_FREE_COOLDOWN_HOURS in lib/constants.js.
async function performSpin(btn) {
    btn.disabled = true;
    const originalHtml = btn.innerHTML;
    btn.innerHTML = 'Loading ad...';

    const startRes = await apiPost('earn', { action: 'spinStart' });
    if (!startRes.ok) {
        toast(errorText(startRes.error), 'error');
        btn.disabled = false; btn.innerHTML = originalHtml;
        return;
    }

    const candidates = [showGigaPubAd, showAdsgramDailyAd]; // ⚠️ CHANGED (admin request) — spin ads: only GigaPub + Adsgram (USL and Monetag removed)
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    try {
        await pick();
    } catch (e) {
        toast('Ad isn\'t available right now. Please try again.', 'error');
        btn.disabled = false; btn.innerHTML = originalHtml;
        return;
    }

    btn.innerHTML = 'Spinning...';
    const r = await apiPost('earn', { action: 'spin', startTime: startRes.startTime, signature: startRes.signature });
    if (!r.ok) {
        toast(errorText(r.error), 'error');
        btn.disabled = false; btn.innerHTML = originalHtml;
        return;
    }

    const wheelEl = document.getElementById('spin-wheel-el');
    const mid = r.segmentIndex * 45 + 22.5;
    const targetRotation = 5 * 360 + (360 - mid); // several full spins + land the winning slice under the top pointer
    if (wheelEl) wheelEl.style.transform = `rotate(${targetRotation}deg)`;

    setTimeout(async () => {
        toast(`🎉 You won ${r.reward} WTC!`, 'success');
        showCongrats(`+${r.reward} WTC`, '🎡', `≈ $${wtcToUsd(r.reward)} USD`);
        await refreshUser();
        if (document.getElementById('spin-wheel-el')) openSpinWheelModal(); // re-render with updated cooldown/spin counts, only if modal's still open
        if (state.activeTab === 'home') renderHome();
    }, 4600);
}

// (first withdrawal only; the wallet is locked afterwards), sees a live

    tonkeeper: { label: 'Tonkeeper Address', currency: 'USDT', placeholder: 'UQ... wallet address',
                 icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zM8 10l4-4 4 4M12 6v10"/></svg>' },
};

function calcNetUsdDisplay(wtc) {
    const gross = wtc / WTC_PER_USD_DISPLAY;
    const afterFirstFee = gross * (1 - WITHDRAW_FEE_PERCENT_DISPLAY / 100);
    const net = afterFirstFee * (1 - WITHDRAW_SECOND_FEE_PERCENT_DISPLAY / 100);
    return net;
}

function openWithdrawModal() {
    let method = 'binance';
    let status = null;       // full GET ?action=status response
    let loadFailed = false;
    let withdrawalsOpen = true;

    function renderClosed() {
        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this)this.remove()">

    // ⚠️ NEW (big update) — "double-check your wallet" step shown before EVERY

    function confirmWallet(methodKey, details, wtc) {

                    <div style="font-size:11.5px; margin-top:6px; color:var(--pending);">⏱ Withdrawals are paid within ${procHours().min}–${procHours().max} hours after you submit.</div>
                    <label style="display:flex; align-items:flex-start; gap:10px; margin:14px 0; font-size:13px; color:var(--ink-muted);">
                        <input type="checkbox" id="wd-confirm-box" style="margin-top:3px;"> <span>I have carefully checked my wallet address and it is correct.</span>
                    </label>
                    <button class="btn btn-money" id="wd-confirm-go" disabled style="margin-bottom:10px;">Confirm & Withdraw</button>
                    <button class="btn btn-outline" id="wd-confirm-back">Go back</button>
                </div>`;
            document.body.appendChild(layer);
            const box = layer.querySelector('#wd-confirm-box');
            const go = layer.querySelector('#wd-confirm-go');
            const finish = (ok) => { layer.remove(); resolve(ok); };
            box.onchange = () => { go.disabled = !box.checked; };
            go.onclick = () => finish(true);
            layer.querySelector('#wd-confirm-back').onclick = () => finish(false);
            layer.onclick = (e) => { if (e.target === layer) finish(false); };

    }

    function reqLine(label, met, detail) {
        return `
        <div style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:6px; color:${met ? 'var(--success)' : 'var(--pending)'};">
            <span>${met ? '✅' : '⏳'}</span><span>${label}${detail ? ` <span class="muted" style="color:inherit; opacity:0.85;">${detail}</span>` : ''}</span>
        </div>`;
    }

    function render() {
        // ⚠️ FIX — render() is called once synchronously (see the bottom of
        // openWithdrawModal) BEFORE loadStatus() has resolved, so `status`
        // is still null on that first call. Every field below reads from
        // `status` unconditionally (status.lockedWallet, status.referralRequirement,
        // etc.) with no optional-chaining, so without this guard the very
        // first render() would throw immediately. Shows a lightweight
        // skeleton instead; loadStatus() calls render() again once real
        // data arrives.
        if (!status) {
            document.getElementById('modal-root').innerHTML = `
                <div class="overlay" onclick="if(event.target===this)this.remove()">
                    <div class="sheet anim-in" style="max-height:88vh;">
                        <div class="sheet-handle"></div>
                        <div class="section-title" style="margin-bottom:14px;">Withdraw WTC</div>
                        <div class="skel" style="height:56px; width:100%; margin-bottom:14px;"></div>
                        <div class="skel" style="height:44px; width:100%; margin-bottom:14px;"></div>
                        <div class="skel" style="height:44px; width:100%; margin-bottom:14px;"></div>
                        <div class="skel" style="height:48px; width:100%;"></div>
                    </div>
                </div>`;
            return;
        }
        const u = state.user || {};
        const wtcBalance = u.wtcBalance || 0;
        const m = WITHDRAW_METHODS_UI[method];

        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this)this.remove()">
                <div class="sheet anim-in" style="max-height:88vh; display:flex; flex-direction:column; position:relative; overflow:hidden;">
                    <div class="jg-glow" style="opacity:0.5;"></div>
                    <div class="sheet-handle" style="position:relative; z-index:1;"></div>
                    <div class="section-title" style="margin-bottom:14px; position:relative; z-index:1;">Withdraw WTC</div>

                    <div style="overflow-y:auto; flex:1; position:relative; z-index:1;">
                        ${status.lockedWallet ? `
                            <!-- ⚠️ NEW — wallet lock (see WALLET_CHANGE_PENALTY_PERCENT,
                                 lib/constants.js). Once a user's first withdrawal sets
                                 this, every withdrawal after just shows it read-only —
                                 no re-typing, no method switch. Changing it requires the
                                 one-time admin-mediated flow (Telegram bot), not this UI. -->
                            <div class="field-label" style="margin-top:0;">Withdrawing to</div>
                            <div style="display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:12px; background:var(--glass-bg); border:1px solid var(--glass-border); margin-bottom:14px;">
                                <div style="font-size:20px;">${WITHDRAW_METHODS_UI[status.lockedWallet.method]?.icon || '💳'}</div>
                                <div style="flex:1; min-width:0;">
                                    <div style="font-size:12.5px; font-weight:600;">${WITHDRAW_METHODS_UI[status.lockedWallet.method]?.label || status.lockedWallet.method}</div>
                                    <div class="muted mono-num" style="font-size:11.5px; word-break:break-all;">${status.lockedWallet.address}</div>
                                </div>
                            </div>
                            <div class="muted" style="font-size:11px; margin:-8px 0 14px;">🔒 Locked to your first withdrawal — contact support in the bot if this address is wrong.</div>
                        ` : `
                            <div class="field-label" style="margin-top:0;">Select gateway</div>
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;">
                                ${Object.entries(WITHDRAW_METHODS_UI).map(([key, cfg]) => `
                                    <button class="btn ${method === key ? 'btn-primary' : 'btn-outline'}" data-method="${key}" style="display:flex; align-items:center; justify-content:center; gap:7px; height:56px; flex-direction:column; font-size:12px;">
                                        ${cfg.icon}${cfg.label.split(' ')[0]}
                                    </button>`).join('')}
                            </div>

                            <div class="field-label">${m.label}</div>
                            <input class="field-input" id="wd-details" placeholder="${m.placeholder}">
                            <div class="muted" style="font-size:11px; margin-top:-8px; margin-bottom:8px;">⚠️ This becomes your permanent withdrawal wallet — double-check it before submitting.</div>
                        `}

                        <div class="field-label">Amount (WTC) — minimum ${fmtWTC(MIN_WITHDRAW_WTC)}</div>
                        <div style="display:flex; gap:8px;">
                            <input class="field-input" id="wd-amount" type="number" placeholder="${MIN_WITHDRAW_WTC}" style="flex:1;">
                            <button class="btn btn-outline" id="wd-max" style="width:auto; padding:0 16px;">MAX</button>
                        </div>
                        <div class="muted" style="font-size:11px; margin-top:5px;">${fmtWTC(WTC_PER_USD_DISPLAY)} WTC = 1 USDT · Balance: <span class="mono-num">${fmtWTC(wtcBalance)} WTC</span></div>

                        <div class="card" style="margin-top:14px; padding:12px 14px;">
                            ${!status ? `<div class="muted" style="font-size:12.5px; text-align:center; padding:6px 0;">${loadFailed ? "Couldn't load — try again." : 'Loading requirements...'}</div>` : `
                                ${status.withdrawRequirements.accountAgeRequiredHours > 0 ? reqLine(`Account at least ${status.withdrawRequirements.accountAgeRequiredHours} hours old`, status.withdrawRequirements.accountAgeMet, status.withdrawRequirements.accountAgeMet ? '' : `(${status.withdrawRequirements.accountAgeHoursRemaining}h left)`) : ''}
                                ${reqLine(`Complete ${status.withdrawRequirements.tasksRequired} tasks (one-time)`, status.withdrawRequirements.tasksMet, `(${status.withdrawRequirements.tasksHave}/${status.withdrawRequirements.tasksRequired})`)}
                                ${reqLine(`Watch ${status.withdrawRequirements.adsRequired} ads today`, status.withdrawRequirements.adsMet, `(${status.withdrawRequirements.adsWatchedToday}/${status.withdrawRequirements.adsRequired})`)}
                                ${reqLine(`Do ${status.withdrawRequirements.spinsRequired} spins (every withdrawal)`, status.withdrawRequirements.spinsMet, `(${Math.min(status.withdrawRequirements.spinsHave, status.withdrawRequirements.spinsRequired)}/${status.withdrawRequirements.spinsRequired})`)}
                                ${status.referralRequirement.isFreePhase
                                    ? '' // free phase: the referral line is hidden until the free withdrawals are used up
                                    // Referrals needed scale with the AMOUNT typed (updateReceiveAndSubmit
                                    // recomputes this live). Referrals can't be bought anymore — invite friends.
                                    : reqLine('Valid referrals available', true, `(${status.referralRequirement.validReferralsAvailable} available, 1 per every $${status.referralRequirement.usdPerReferral})`)}
                            `}
                        </div>

                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--border);">
                            <span class="muted" style="font-size:13px;">You receive</span>
                            <span id="wd-receive" class="mono-num" style="font-size:18px; font-weight:700; color:var(--money);">$0.0000</span>
                        </div>
                        <div class="muted" style="font-size:10.5px; margin-top:4px;">${WITHDRAW_SECOND_FEE_PERCENT_DISPLAY > 0 ? `Fees: ${WITHDRAW_FEE_PERCENT_DISPLAY}% + ${WITHDRAW_SECOND_FEE_PERCENT_DISPLAY}%, taken together at withdraw time.` : `Withdrawal fee: ${WITHDRAW_FEE_PERCENT_DISPLAY}%`}</div>
                        <div style="font-size:11.5px; margin-top:8px; color:var(--pending);">⏱ Withdrawals are paid within ${procHours().min}–${procHours().max} hours after you submit.</div>
                    </div>

                    <button class="btn btn-money" style="margin-top:14px; position:relative; z-index:1;" id="wd-submit" disabled>Loading...</button>
                </div>
            </div>`;

        document.querySelectorAll('[data-method]').forEach(btn => {
            btn.onclick = () => { method = btn.dataset.method; render(); };
        });
        document.getElementById('wd-max').onclick = () => {
            // ⚠️ NEW — for a first-time (free) withdrawal, MAX shouldn't
            // fill in more than the free cap, or it'd just disable the
            // submit button immediately.
            const cap = (status?.referralRequirement?.isFreePhase)
                ? Math.min(wtcBalance, status.referralRequirement.freeWithdrawMaxWtc)
                : wtcBalance;
            document.getElementById('wd-amount').value = Math.floor(cap);
            updateReceiveAndSubmit();
        };
        document.getElementById('wd-amount').oninput = updateReceiveAndSubmit;
        document.getElementById('wd-submit').onclick = submitWithdraw;
        updateReceiveAndSubmit();
    }

    function updateReceiveAndSubmit() {
        const amountEl = document.getElementById('wd-amount');
        const btn = document.getElementById('wd-submit');
        const receiveEl = document.getElementById('wd-receive');
        if (!amountEl || !btn) return;

        const wtc = Math.floor(parseFloat(amountEl.value) || 0);
        receiveEl.textContent = `$${calcNetUsdDisplay(wtc).toFixed(4)}`;

        if (!status) { btn.disabled = true; btn.textContent = loadFailed ? 'Retry' : 'Loading...'; return; }

        const u = state.user || {};
        const wtcBalance = u.wtcBalance || 0;
        const reqOk = status.withdrawRequirements.adsMet && status.withdrawRequirements.tasksMet && status.withdrawRequirements.spinsMet !== false && status.withdrawRequirements.accountAgeMet !== false;
        // ⚠️ CHANGED — was a flat "1 valid referral" check (status.referralRequirement.met).
        // Now computed live from the CURRENT typed amount, same formula the
        // server re-verifies at submit (requiredReferralsForUsd, lib/constants.js).
        const grossUsd = wtc / WTC_PER_USD_DISPLAY;
        const referralsNeeded = status.referralRequirement.isFreePhase
            ? 0
            : Math.max(1, Math.ceil(grossUsd / status.referralRequirement.usdPerReferral));
        const refOk = status.referralRequirement.isFreePhase || status.referralRequirement.validReferralsAvailable >= referralsNeeded;

        if (loadFailed) { btn.disabled = false; btn.textContent = 'Retry'; return; }
        if (status.withdrawPending) { btn.disabled = true; btn.textContent = 'A request is already pending'; return; }
        if (wtc < MIN_WITHDRAW_WTC) { btn.disabled = true; btn.textContent = `Minimum ${fmtWTC(MIN_WITHDRAW_WTC)} WTC`; return; }
        if (wtc > wtcBalance) { btn.disabled = true; btn.textContent = 'Insufficient WTC balance'; return; }
        // ⚠️ NEW — the free first withdrawal is capped; catch it client-side
        // too so the button disables instead of letting the user submit and
        // only then find out from the server.
        if (status.referralRequirement.isFreePhase && wtc > status.referralRequirement.freeWithdrawMaxWtc) {
            btn.disabled = true; btn.textContent = `Max $${status.referralRequirement.freeWithdrawMaxUsd} (${fmtWTC(status.referralRequirement.freeWithdrawMaxWtc)} WTC) per withdrawal`; return;
        }
        if (!reqOk) { btn.disabled = true; btn.textContent = 'Complete requirements above'; return; }
        if (!refOk) {
            btn.disabled = true;
            btn.textContent = `Need ${referralsNeeded} valid referral${referralsNeeded === 1 ? '' : 's'} (have ${status.referralRequirement.validReferralsAvailable})`;
            return;
        }
        btn.disabled = false;
        btn.textContent = `Withdraw ${fmtWTC(wtc)} WTC`;
    }

    async function loadStatus() {
        const r = await apiGet(`withdraw?action=status&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        if (!r.ok) {
            loadFailed = true;
            updateReceiveAndSubmit();
            return;
        }
        if (r.withdrawalsOpen === false) {
            withdrawalsOpen = false;
            renderClosed();
            return;
        }
        loadFailed = false;
        status = r;
        // ⚠️ NEW — if a wallet is already locked, sync the selector to it
        // (though it won't be shown/editable — see render() below).
        if (status.lockedWallet) method = status.lockedWallet.method;
        render();
    }

    async function submitWithdraw() {
        // ⚠️ CHANGED — when a wallet is already locked, there's no #wd-details
        // input in the DOM at all (see render() above) — use the locked
        // address directly. The server ignores/overrides this anyway (see
        // api/withdraw.js), but sending it keeps this function simple.
        const details = status.lockedWallet ? status.lockedWallet.address : document.getElementById('wd-details').value.trim();
        const wtcAmount = Math.floor(parseFloat(document.getElementById('wd-amount').value) || 0);
        if (loadFailed) { loadStatus(); return; }
        if (!details) return toast('Please enter your address/UID.', 'error');
        if (!status.lockedWallet && !/^[A-Za-z0-9_\-:.+\/=]{5,100}$/.test(details)) return toast(errorText('invalid_address'), 'error');
        if (!wtcAmount) return toast('Please enter an amount.', 'error');

        // ⚠️ NEW (big update) — user must look at the wallet address before money leaves.
        const okToSend = await confirmWallet(status.lockedWallet ? status.lockedWallet.method : method, details, wtcAmount);
        if (!okToSend) return;

        const btn = document.getElementById('wd-submit');
        btn.textContent = 'Submitting...'; btn.disabled = true;
        const r = await apiPost('withdraw', { method, details, wtcAmount });
        if (r.ok) {
            toast(`Withdraw request submitted — you'll be paid within ${procHours().min}–${procHours().max} hours.`, 'success');
            triggerBurst(btn);
            setTimeout(() => { document.getElementById('modal-root').innerHTML = ''; }, 200);
            await refreshUser();
            if (state.activeTab === 'home') renderHome();
        } else {
            toast(r.message || errorText(r.error), 'error');
            await loadStatus();
        }
    }

    render();
    loadStatus();
}

// Yields the same permutation for everyone all day, then a different one
// tomorrow — a tiny linear-congruential PRNG seeded from the date string,
// no crypto needed since this is just display order, not anything security-sensitive.
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function seededShuffle(arr, seedStr) {
    let seed = 0;
    for (let i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
    const rand = () => { seed = (seed * 1103515245 + 12345) >>> 0; return seed / 4294967296; };
    const out = [...arr];
    for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
}

async function tryClaimLootbox() {
    const pending = state.user?.pendingVideoWTC || 0;
    if (pending < 25) { toast(`You need at least 25 WTC to claim (currently ${fmtWTC(pending)}).`, 'info'); return; }

    // ⚠️ SECURITY FIX — request a signed token FIRST (before the ad even
    // loads), same pattern as watchAdNetwork's adStart. The server checks
    // real elapsed time between this and the claim call, so the ad can't be
    // skipped by calling claimLootbox directly.
    const startRes = await apiPost('earn', { action: 'lootboxAdStart' });
    if (!startRes.ok) { toast(errorText(startRes.error), 'error'); return; }

    // Show one random real ad (Adsgram, GigaPub or Monetag) before granting the reward —
    // the reward only fires after the ad SDK's promise actually resolves.
    const candidates = [showAdsgramDailyAd, showGigaPubAd, showMonetagAd]; // ⚠️ FIX — showAdsgramSpecialAd no longer exists (network removed); swapped in showGigaPubAd
    const pick = candidates[Math.floor(Math.random() * candidates.length)];

let sessionEarnedTotal = 0;
let sessionDisplayWTC = 0; // visual only — increments every 10s for mining feel
let videoWatchSeconds = 0;
let lastMonetagInterstitialAt = 0;

function updateLootboxFullUI(isFull) {
    const banner = document.getElementById('vp-lootbox-full-banner');
    const sub = document.getElementById('vp-session-sub');
    if (!banner || !sub) return;
    banner.style.display = isFull ? 'block' : 'none';
    sub.textContent = isFull ? 'Paused — claim your lootbox to resume earning' : '60 WTC earned per hour watched';

async function startVideoSession() {
    sessionEarnedTotal = 0;
    sessionDisplayWTC = 0;
    videoWatchSeconds = 0;
    lastMonetagInterstitialAt = 0;
    const startRes = await apiPost('earn', { action: 'videoStart' }); // ⚠️ CHANGED — userId no longer sent; server now derives it from verified initData only (see api/earn.js)
    if (!startRes.success) { toast(errorText(startRes.error), 'error'); return; }
    state.videoSession = { startTime: startRes.startTime, signature: startRes.signature };
    updateLootboxFullUI((state.user?.pendingVideoWTC || 0) >= 25);

    // ── Visual counter: every 10 seconds, adds ~0.167 WTC (= 60 WTC/hr / 360 ticks/hr)
    // This is purely for display — it makes the UI feel like a miner ticking up.
    // The real WTC is only credited by the 30-second backend call below.
    // ⚠️ FIX: this used to keep climbing even after the backend stopped crediting
    // (once pendingVideoWTC hits the 25 WTC claim threshold), so the video page
    // could show e.g. "90 WTC" for a full hour watched while the real claimable
    // amount silently capped out much lower — a confusing "where did my WTC go"
    // moment when the user went back to actually claim. Now the ticker freezes
    // (and shows the same lootbox-full banner) the instant the real cap is hit,
    // so the number on screen is always the number they'll actually get.
    state.videoDisplayInterval = setInterval(() => {
        if (!state.videoSession) return;
        if ((state.user?.pendingVideoWTC || 0) >= 25) { updateLootboxFullUI(true); return; }
        sessionDisplayWTC = parseFloat((sessionDisplayWTC + 0.167).toFixed(3));
        const out = document.getElementById('vp-session-wtc');
        if (out) out.textContent = `${sessionDisplayWTC.toFixed(1)} WTC`;
    }, 10000);

    // ── Backend API: every 30 seconds, actually credits WTC to pendingVideoWTC ──
    state.videoSessionInterval = setInterval(async () => {
        if (!state.videoSession) return;
        videoWatchSeconds += 30;

    // ⚠️ RESTORED (explicit admin request, reversing the earlier removal) —
    // fires the Monetag in-app interstitial once every 5 minutes of video
    // watching. See fireMonetagInAppInterstitial() above for what the call
    // actually does and why it looks different from the rewarded-ad call.
    if (videoWatchSeconds - lastMonetagInterstitialAt >= 300) {
        lastMonetagInterstitialAt = videoWatchSeconds;
        fireMonetagInAppInterstitial();
    }

        const elapsedSec = Math.floor((Date.now() - state.videoSession.startTime) / 1000);
        const claimable = Math.floor(elapsedSec * (60 / 3600)); // 60 WTC/hr — matches backend VIDEO_WTC_PER_SECOND (lib/constants.js)
        if (claimable <= 0) return;

        // ⚠️ NEW: once 25+ WTC is already sitting unclaimed in the lootbox, the
        // backend won't credit more anyway — skip the call, keep the video
        // session alive (so it resumes right after they claim), and nudge them
        // once (not every 30s, to avoid spamming toasts).
        if ((state.user?.pendingVideoWTC || 0) >= 25) {
            updateLootboxFullUI(true);
            if (!state._lootboxNudgeShown) {
                state._lootboxNudgeShown = true;
                toast('🎁 Your lootbox is full — claim it to keep earning!', 'info');
            }
            return;
        }
        updateLootboxFullUI(false);

        const r = await apiPost('earn', { action: 'videoClaim', startTime: state.videoSession.startTime, signature: state.videoSession.signature, claimedPoints: claimable });
        if (r.ok) {
            sessionEarnedTotal += claimable;
            // Sync display to actual earned value after each real credit
            sessionDisplayWTC = Math.max(sessionDisplayWTC, sessionEarnedTotal);
            const out = document.getElementById('vp-session-wtc');
            if (out) out.textContent = `${sessionDisplayWTC.toFixed(1)} WTC`;
            if (state.user) state.user.pendingVideoWTC = r.pendingVideoWTC;
            renderFloatingLootbox();
            showLootboxGain(claimable);
            const fresh = await apiPost('earn', { action: 'videoStart' });
            if (fresh.success) state.videoSession = { startTime: fresh.startTime, signature: fresh.signature };
        } else if (r.error === 'lootbox_claim_required') {
            updateLootboxFullUI(true);
            if (!state._lootboxNudgeShown) {
                state._lootboxNudgeShown = true;
                toast('🎁 Your lootbox is full — claim it to keep earning!', 'info');
            }
        } else if (r.error === 'video_token_expired' || r.error === 'invalid_signature') {
            // ⚠️ NEW — self-heal: this can legitimately happen if the tab was
            // backgrounded/throttled past the 5-minute token expiry (see
            // api/earn.js handleVideoClaim). Just get a fresh token silently
            // and keep the session going — the elapsed time already missed
            // is genuinely lost (by design, same as every other ad/task
            // token here), but there's no reason to make the user restart
            // watching from scratch over it.
            const fresh = await apiPost('earn', { action: 'videoStart' });
            if (fresh.success) state.videoSession = { startTime: fresh.startTime, signature: fresh.signature };
        }
    }, 30000);
}

async function startGameSession() {
    stopGameTimer();

    gameSess.startTime = r.startTime; gameSess.signature = r.signature;
    // Only counts seconds while the app is visible (client side; the server independently enforces real elapsed time).
    gameSess.timer = setInterval(() => {
        if (!gameSess) return;
        if (document.visibilityState === 'visible' && gameClaimsLeft() > 0) gameSess.playedSec++;
        updateGameClaimUI();
    }, 1000);
    updateGameClaimUI();
}
function stopGameTimer() { if (gameSess?.timer) clearInterval(gameSess.timer); }

function updateGameClaimUI() {
    const btn = document.getElementById('gp-claim-btn');
    const sub = document.getElementById('gp-claim-sub');
    if (!btn || !sub) return;
    const left = gameClaimsLeft();
    if (left <= 0) {
        btn.disabled = true; btn.textContent = 'Daily limit reached';
        sub.textContent = `You've claimed all ${GAME_DAILY_MAX_UI} rewards today. Come back tomorrow!`;
        return;
    }
    const played = gameSess?.playedSec || 0;
    const remain = Math.max(0, GAME_PLAY_SECONDS_UI - played);
    sub.textContent = `${left}/${GAME_DAILY_MAX_UI} rewards left today`;
    if (gameSess?.claiming) { btn.disabled = true; return; }
    if (remain > 0) {
        const mm = String(Math.floor(remain / 60)).padStart(2, '0'), ss = String(remain % 60).padStart(2, '0');
        btn.disabled = true; btn.textContent = `Play ${mm}:${ss} more to claim`;
    } else {
        btn.disabled = false; btn.textContent = `🎁 Claim ${GAME_REWARD_RANGE_UI} WTC`;
    }
}

async function claimGameReward() {
    if (!gameSess || gameSess.claiming || gameSess.playedSec < GAME_PLAY_SECONDS_UI) return;
    gameSess.claiming = true; updateGameClaimUI();
    const btn = document.getElementById('gp-claim-btn');
    if (btn) btn.textContent = 'Loading ad...';
    try {
        const adTok = await apiPost('earn', { action: 'gameAdStart' });
        if (!adTok.ok) { toast(errorText(adTok.error), 'error'); gameSess.claiming = false; updateGameClaimUI(); return; }
        try { await pickGameAd()(); }
        catch (e) { toast(errorText(e.message), 'error'); gameSess.claiming = false; updateGameClaimUI(); return; }
        if (btn) btn.textContent = 'Checking...';
        const r = await apiPost('earn', { action: 'gameClaim', startTime: gameSess.startTime, signature: gameSess.signature, adStartTime: adTok.startTime, adSignature: adTok.signature });
        if (r.ok) {
            toast(`+${r.reward} WTC added to your balance!`, 'success');
            triggerBurst(btn);
            showCongrats(`+${r.reward} WTC`, '🎮', `≈ $${wtcToUsd(r.reward)} USD`);
            await refreshUser();
            await startGameSession(); // fresh 2-minute round
        } else {
            toast(errorText(r.error), 'error');
            if (gameSess) gameSess.claiming = false;
            await refreshUser();
            updateGameClaimUI();
        }
    } catch (e) {
        toast('Something went wrong, try again.', 'error');
        if (gameSess) gameSess.claiming = false; updateGameClaimUI();
    }
}

// ⚠️ SECURITY FIX — now requests a signed ad-token from the server BEFORE
// showing the ad (adStart), and passes that exact token through to
// creditAdReward afterward. A bare "network name" is no longer enough to
// get a reward — see api/earn.js.
// ⚠️ REMOVED (this update) — the Monetag-specific ymid/postback branch that
// used to live here. Admin decision: reverted Monetag back to the same
// adStart→show→claimAdReward flow every other network uses (see
// AD_NETWORK_REWARDS in lib/constants.js).
async function watchAdNetwork(network) {
    const showFn = AD_SHOW_FUNCTIONS[network];
    const networkLabel = AD_NETWORKS_UI.find(n => n.id === network)?.label || network;
    toast(`Loading ${networkLabel} ad...`, 'info');
    try {
        const startRes = await apiPost('earn', { action: 'adStart', network });
        if (!startRes.ok) { toast(errorText(startRes.error), 'error'); return; }
        // ⚠️ NEW (ads update) — measure how long the ad was REALLY on screen
        // (SDK call → SDK promise resolves). Sent to the server, which rejects
        // anything shorter than that network's minWatchSeconds.
        const shownAt = Date.now();
        await showFn();
        const viewMs = Date.now() - shownAt;
        await creditAdReward(network, startRes.startTime, startRes.signature, viewMs);
    } catch (e) {
        // A network-specific, explicit message — a different network's ad is
        // never played instead; on failure the user is told directly to try
        // again or pick a different option.
        toast(`${networkLabel} ad isn't available right now. Please try again or pick a different network.`, 'error');
    }
}

// 🔥 NEW — daily login streak card (top of the Earning tab). Client-side
// day math here is only a PREVIEW for the UI (what day/reward the user is
// about to claim) — the server (api/earn.js handleStreakClaim) is what
// actually decides and enforces the real streak day, so a mismatched clock
// or client tampering can't grant an extra day.
const STREAK_REWARDS_UI = [10, 20, 35, 55, 80, 120, 200]; // keep in sync with STREAK_REWARDS (lib/constants.js)
const bdDateStr = (d) => new Date(d).toLocaleDateString('en-US', { timeZone: 'Asia/Dhaka' });

function renderStreakCard() {
    const wrap = document.getElementById('streak-card-wrap');
    if (!wrap) return;
    const u = state.user || {};
    const streakCount = u.streakCount || 0;
    const todayStr = bdDateStr(Date.now());
    const claimedToday = u.streakLastClaimDate && bdDateStr(u.streakLastClaimDate) === todayStr;
    const yesterdayStr = bdDateStr(Date.now() - 86400000);
    const willContinue = u.streakLastClaimDate && bdDateStr(u.streakLastClaimDate) === yesterdayStr;
    const previewDay = claimedToday
        ? (streakCount >= 7 ? 1 : streakCount + 1) // tomorrow's preview
        : (willContinue ? (streakCount >= 7 ? 1 : streakCount + 1) : 1);
    const previewReward = STREAK_REWARDS_UI[previewDay - 1];

    wrap.innerHTML = `
        <div class="card" style="margin-bottom:14px; border-left:2.5px solid var(--coin); background:linear-gradient(155deg, rgba(255,210,74,0.08), transparent);">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;">

                <div class="muted" style="font-size:11.5px;">${claimedToday ? streakCount : (willContinue ? streakCount : 0)}/7 days</div>
            </div>
            <div style="display:flex; gap:5px; margin-bottom:12px;">
                ${STREAK_REWARDS_UI.map((r, i) => {
                    const day = i + 1;
                    const done = claimedToday ? day <= streakCount : (willContinue ? day <= streakCount : false);
                    const isNext = day === previewDay;
                    return `<div style="flex:1; text-align:center; padding:6px 2px; border-radius:8px; background:${done ? 'var(--coin)' : (isNext ? 'rgba(255,210,74,0.15)' : 'var(--surface-pop)')}; border:1px solid ${isNext && !done ? 'var(--coin)' : 'var(--border)'};">
                        <div style="font-size:9px; color:${done ? '#04231d' : 'var(--ink-faint)'};">D${day}</div>
                        <div style="font-size:9.5px; font-weight:700; color:${done ? '#04231d' : (isNext ? 'var(--coin)' : 'var(--ink-muted)')};">${r}</div>
                    </div>`;
                }).join('')}
            </div>
            <button class="btn btn-primary" id="streak-claim-btn" style="width:100%;" ${claimedToday ? 'disabled' : ''}>
                ${claimedToday ? `✅ Day ${streakCount}/7 claimed — come back tomorrow` : `🎁 Claim Day ${previewDay} — +${previewReward} WTC`}
            </button>
        </div>`;
    const btn = document.getElementById('streak-claim-btn');
    if (btn && !claimedToday) btn.onclick = claimStreak;
}

async function claimStreak() {

function goToTask(taskId, url, category, verifyType) {
    // Open the link first
    if (url) window.open(url, '_blank');

    // Then show the claim/verify sheet — user must actively press Claim
    const task = state.tasks.find(t => t._id === taskId);
    // ⚠️ CHANGED (this update) — was `category === 'channel'`. Now keyed off
    // verifyType so any category (Daily/Exclusive/Partner/Earning) can be an
    // API-verified (Telegram join) task, not just the dedicated Verify tab.
    const isVerified = verifyType === 'api';

    // ⚠️ NEW — issue a signed taskStart token the instant the sheet opens
    // (non-API-verified tasks only — API-verified tasks are independently
    // verified via real Telegram membership and don't need this). Stored in a
    // closure-scoped variable and sent along with the claim below — see
    // handleTaskStart/handleTaskComplete in api/earn.js for why.
    let taskToken = null;
    if (!isVerified) {
        apiPost('earn', { action: 'taskStart', taskId }).then(r => {
            if (r?.ok) taskToken = { startTime: r.startTime, signature: r.signature };
        });
    }

    document.getElementById('modal-root').innerHTML = `
        <div class="overlay" onclick="if(event.target===this)this.remove()">
            <div class="sheet anim-in">
                <div class="sheet-handle"></div>
                <div style="font-weight:600; font-size:16px; margin-bottom:6px;">${esc(task?.title || 'Task')}</div>
                <div class="muted" style="font-size:13px; margin-bottom:18px;">
                    ${isVerified
                        ? 'After joining the channel/group, tap Verify below. Our server will check your membership.'
                        : 'After completing the task above, tap Claim to receive your reward.'}
                </div>
                ${isVerified ? `
                    <button class="btn btn-signal" id="task-verify-btn" style="margin-bottom:10px;">
                        ✅ Verify Membership
                    </button>` : `
                    <button class="btn btn-primary" id="task-claim-btn" style="margin-bottom:10px;" disabled>
                        🎁 Claim in 5s
                    </button>`}
                <button class="btn btn-outline" onclick="document.getElementById('modal-root').innerHTML=''">
                    Cancel
                </button>
            </div>
        </div>`;

    const actionBtn = document.getElementById('task-verify-btn') || document.getElementById('task-claim-btn');
    if (actionBtn) {
        actionBtn.onclick = async () => {
            actionBtn.disabled = true;
            actionBtn.textContent = 'Checking...';
            await completeTask(taskId, taskToken);
        };
    }

    // ⚠️ Soft anti-abuse friction (matches the read→wait→claim pattern from
    // reference apps) — link-based tasks can't be server-verified (we can't
    // confirm someone actually visited an external site), so this at least
    // stops instant claim-without-clicking. It's not real verification, just
    // a reasonable minimum.
    const claimBtn = document.getElementById('task-claim-btn');
    if (claimBtn) {
        let remaining = 5; // ⚠️ CHANGED — was 10s (per admin request). See TASK_MIN_WAIT_SECONDS in lib/constants.js, lowered to match.
        const timer = setInterval(() => {
            remaining--;
            if (!claimBtn.isConnected) { clearInterval(timer); return; }
            if (remaining <= 0) {
                clearInterval(timer);
                claimBtn.disabled = false;
                claimBtn.innerHTML = '🎁 Claim Reward';
            } else {
                claimBtn.textContent = `🎁 Claim in ${remaining}s`;
            }
        }, 1000);
    }
}

async function completeTask(taskId, taskToken) {
    const r = await apiPost('earn', { action: 'taskComplete', taskId, startTime: taskToken?.startTime, signature: taskToken?.signature });
    document.getElementById('modal-root').innerHTML = ''; // close sheet
    if (r.ok) {
        toast(`+${r.rewardWtc} WTC added!`, 'success');
        triggerBurst(document.querySelector(`button[data-task="${taskId}"]`) || document.body);
        showCongrats(`+${r.rewardWtc} WTC`, '✅', `≈ $${wtcToUsd(r.rewardWtc)} USD`);
        await refreshUser();

        // ── Vanishes the completed task's card with an animation, then refreshes the list ──
        const refreshActiveTab = () => {
            if (state.activeTab === 'earning') renderEarningTab();
            else if (state.activeTab === 'task') renderTaskTab();
        };
        const card = document.querySelector(`[data-task-card="${taskId}"]`);
        if (card) {
            card.classList.add('task-vanish');
            setTimeout(refreshActiveTab, 480);
        } else {
            refreshActiveTab();
        }
    }
    else if (r.alreadyDone) { toast('You already completed this task.', 'info'); }
    else if (r.error === 'not_member') { toast('Not a member yet — join first, then verify.', 'error'); }
    else { toast(errorText(r.error), 'error'); }
}

// ⚠️ NEW — "Create Task" button (Task tab). A user pays TON to publish

    // ── screen 1: "My Created Tasks" + entry point into the form ──

        document.getElementById('modal-root').innerHTML = `

                    <div class="muted" style="font-size:12px; margin-bottom:14px;">Pay TON to submit your own task for admin review — once approved, it goes live in the ⭐ Exclusive section and other users complete it for ${TASK_CREATE_REWARD_PER_TASK_WTC_DISPLAY} WTC each.</div>
                    <div id="ct-my-tasks">
                        <div class="skel" style="height:50px; margin:8px 0; border-radius:12px;"></div>
                        <div class="skel" style="height:50px; margin:8px 0; border-radius:12px;"></div>
                    </div>

                </div>
            </div>`;
        document.getElementById('ct-new-btn').onclick = renderForm;

        const r = await apiGet(`payments?resource=taskcreate&action=myTasks&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        const body = document.getElementById('ct-my-tasks');
        if (!body) return; // modal closed before this resolved
        if (!r.ok || !r.tasks?.length) {
            body.innerHTML = `<div class="muted" style="font-size:12.5px; text-align:center; padding:10px 0;">You haven't created any tasks yet.</div>`;
            return;
        }
        body.innerHTML = r.tasks.map(t => {
            const limit = t.limit || 0;
            const done = t.completionCount || 0;
            const pct = limit ? Math.min(100, Math.round((done / limit) * 100)) : 0;
            const isDone = limit > 0 && done >= limit;
            // ⚠️ NEW — reviewStatus (see api/bot.js "🕐 Pending Review"). A
            // paid task sits pending_review before it's ever visible to
            // anyone else — show that clearly instead of a misleading 0/N
            // progress bar that looks like it's just waiting for completions.
            if (t.reviewStatus === 'rejected') {
                return `
                <div class="card" style="padding:10px 12px; margin-bottom:8px; opacity:0.7;">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                        <div style="font-size:13px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(t.title)}</div>
                        <div style="font-size:11px; color:var(--error, #E14D4D); flex-shrink:0;">❌ Rejected</div>
                    </div>
                </div>`;
            }
            if (t.reviewStatus === 'pending_review' || !t.isApproved) {
                return `
                <div class="card" style="padding:10px 12px; margin-bottom:8px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                        <div style="font-size:13px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(t.title)}</div>

                    <div style="font-size:13px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(t.title)}</div>

                </div>
                <div style="height:6px; border-radius:4px; background:var(--surface-raised); margin-top:8px; overflow:hidden;">
                    <div style="height:100%; width:${pct}%; background:${isDone ? 'var(--success)' : 'var(--exclusive-hue)'};"></div>

    function captureFormFields() {
        const ch = document.getElementById('ct-channel'); if (ch) formData.channelUsername = ch.value;
        const url = document.getElementById('ct-url'); if (url) formData.url = url.value;
        const title = document.getElementById('ct-title'); if (title) formData.title = title.value;
    }

    function renderForm() {
        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this)this.remove()">
                <div class="sheet anim-in" style="max-height:88vh; overflow-y:auto;">
                    <div class="sheet-handle"></div>

                    ${formData.verifyType === 'api' ? `

                        <div class="muted" style="font-size:11px; margin-top:6px; margin-bottom:10px; line-height:1.5;">⚠️ NEWTUBE bot must be an ADMIN in this channel/group, or membership can never be verified and users won't be able to complete this task — your TON payment is non-refundable either way.</div>
                    ` : `
                        <div class="field-label">Link (Telegram bot or website)</div>

                    `}

                    <div class="field-label">Task title</div>

                    <div class="field-label">How many people can complete it?</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px;">
                        ${Object.entries(TASK_CREATE_PACKAGES_DISPLAY).map(([count, priceTon]) => `
                            <button class="btn ${formData.package === count ? 'btn-primary' : 'btn-outline'}" data-pkg="${count}" style="height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12px;">
                                <span style="font-weight:700;">${count} tasks</span>
                                <span class="mono-num" style="font-size:11px; opacity:0.85;">${priceTon} TON</span>
                            </button>`).join('')}
                    </div>
                    <div class="muted" style="font-size:11px; margin-bottom:14px;">Each completion pays the user ${TASK_CREATE_REWARD_PER_TASK_WTC_DISPLAY} WTC.</div>

                    <button class="btn btn-primary" id="ct-submit" style="width:100%;">Continue to Payment</button>
                    <button class="btn btn-outline" id="ct-back" style="width:100%; margin-top:8px;">← Back</button>
                </div>
            </div>`;

        document.querySelectorAll('[data-vtype]').forEach(b => b.onclick = () => { captureFormFields(); formData.verifyType = b.dataset.vtype; renderForm(); });
        document.querySelectorAll('[data-pkg]').forEach(b => b.onclick = () => { captureFormFields(); formData.package = b.dataset.pkg; renderForm(); });
        document.getElementById('ct-back').onclick = () => { captureFormFields(); renderList(); };
        document.getElementById('ct-submit').onclick = submitForm;
    }

    async function submitForm() {
        captureFormFields();
        formData.title = formData.title.trim();
        if (!formData.title) return toast('Please enter a task title.', 'error');
        if (formData.verifyType === 'api' && !formData.channelUsername.trim()) return toast('Please enter a channel/group username.', 'error');
        if (formData.verifyType === 'link' && !formData.url.trim()) return toast('Please enter a link.', 'error');

        const btn = document.getElementById('ct-submit');
        btn.textContent = 'Creating order...';
        btn.disabled = true;
        const r = await apiPost('payments', {
            resource: 'taskcreate',
            action: 'create',
            package: formData.package,
            title: formData.title,
            verifyType: formData.verifyType,
            channelUsername: formData.channelUsername,
            url: formData.url,
        });
        if (!document.getElementById('ct-submit')) return; // modal closed before this resolved
        if (!r.ok) {
            toast(errorText(r.error), 'error');
            btn.textContent = 'Continue to Payment';
            btn.disabled = false;
            return;
        }
        order = r.order;
        renderPay();

    // ── screen 3: payment (mirrors openBuyValidReferModal's waiting screen) ──
    function renderPay() {

                    <div class="card" style="padding:14px; margin-bottom:12px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <span class="muted" style="font-size:12px;">Amount</span>

                        </div>
                        <div class="field-label" style="margin-top:0;">Send to this address</div>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <div class="mono-num" style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; background:var(--surface-raised); padding:9px 10px; border-radius:8px;">${order.address}</div>
                            <button class="btn btn-outline" id="ct-copy-addr" style="width:auto; padding:0 12px;">Copy</button>

                        </div>

                    </div>

                            <span style="width:12px; height:12px; border-radius:50%; border:2px solid var(--pending); border-top-color:transparent; display:inline-block; animation:spin 0.8s linear infinite;"></span>
                            Waiting for payment...
                        </div>
                        <div id="ct-countdown" class="muted" style="font-size:11.5px; margin-top:6px;"></div>
                    </div>

                    <button class="btn btn-outline" id="ct-cancel" style="width:100%; margin-top:14px; font-size:12.5px;">Cancel order</button>
                </div>
            </div>`;

        document.getElementById('ct-copy-addr').onclick = () => { navigator.clipboard.writeText(order.address); toast('Address copied!', 'success'); };
        document.getElementById('ct-copy-memo').onclick = () => { navigator.clipboard.writeText(order.memo); toast('Memo copied!', 'success'); };
        document.getElementById('ct-open-tonkeeper').onclick = () => openTonkeeperLink(order.deepLink);
        document.getElementById('ct-cancel').onclick = async () => {
            stopTimers();
            await apiPost('payments', { resource: 'taskcreate', action: 'cancel', orderId: order.id });
            toast('Order cancelled.', 'info');
            close();
        };

        startCountdown();
        startPolling();
    }

    function startCountdown() {
        const expiresAt = new Date(order.expiresAt).getTime();
        const tick = () => {
            const el = document.getElementById('ct-countdown');
            if (!el) { clearInterval(countdownTimer); return; }
            const msLeft = expiresAt - Date.now();
            if (msLeft <= 0) {
                el.textContent = 'Expired';
                clearInterval(countdownTimer);
                return;
            }
            const mm = Math.floor(msLeft / 60000);
            const ss = Math.floor((msLeft % 60000) / 1000);
            el.textContent = `Auto-cancels in ${mm}:${String(ss).padStart(2, '0')} if unpaid`;
        };
        tick();
        countdownTimer = setInterval(tick, 1000);
    }

    function startPolling() {
        pollTimer = setInterval(async () => {
            const s = await apiGet(`payments?resource=taskcreate&action=status&orderId=${order.id}&initData=${encodeURIComponent(TG_INIT_DATA)}`);
            if (!document.getElementById('ct-status-line')) { clearInterval(pollTimer); return; } // modal closed
            if (!s.ok) return; // transient error — just try again next tick
            if (s.status === 'paid') {
                stopTimers();
                triggerBurst(document.getElementById('modal-root'));
                showCongrats('Payment Confirmed!', '⏳');
                toast('Payment confirmed — your task is now pending admin review.', 'success');
                setTimeout(() => close(true), 1200);
            } else if (s.status === 'expired') {
                stopTimers();
                document.getElementById('modal-root').innerHTML = `
                    <div class="overlay" onclick="if(event.target===this)this.remove()">
                        <div class="sheet anim-in">
                            <div class="sheet-handle"></div>
                            <div style="text-align:center; padding:20px 0;">

                                <div class="muted" style="font-size:12.5px; margin-bottom:16px;">No payment was received within ${TASK_CREATE_ORDER_EXPIRY_MIN_DISPLAY} minutes.</div>
                                <button class="btn btn-primary" id="ct-retry" style="width:100%;">Try again</button>
                            </div>
                        </div>
                    </div>`;
                document.getElementById('ct-retry').onclick = renderForm;
            }
        }, 4000);
    }

    renderList();
}

    if (!hydrateDisplayUserFields()) {
        await new Promise(r => setTimeout(r, 800));
        if (!hydrateDisplayUserFields()) {
            await new Promise(r => setTimeout(r, 1500));
        }
    }
    if (!TG_INIT_DATA || !hydrateDisplayUserFields()) {
        document.getElementById('splash').remove();
        document.getElementById('app-root').innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:16px; text-align:center; padding:0 30px;">

    }

    const initRes = await apiPost('user', { action: 'init', fingerprint: await generateDeviceFingerprint() });
    if (initRes && initRes.ok === false && initRes.error === 'ip_in_use') {
        const splashEl = document.getElementById('splash');
        if (splashEl) splashEl.remove();
        showIpInUseScreen(initRes.owner);
        return;
    }
    // ⚠️ FIX — any OTHER init failure (timeout, 500, cold-start DB error, etc.)
    // used to be silently ignored here — execution just carried on into
    // refreshUser() as if init had succeeded. Now any non-ip_in_use failure
    // goes straight to the retry screen instead of limping forward.
    if (!initRes || initRes.ok === false) {
        showConnectionErrorScreen();
        return;
    }
    try {
        await refreshUser();
    } catch (e) {
        if (e.message === 'banned') {
            // Ban screen already shown in refreshUser() — remove splash and stop
            const splash = document.getElementById('splash');
            if (splash) { splash.classList.add('out'); setTimeout(() => splash.remove(), 550); }
            return;
        }
        // ⚠️ FIX — connection_timeout / connection_failed / any other unexpected
        // error now shows a visible retry screen instead of either hanging on
        // the static "92%" splash forever (old timeout-less fetch) or, if it
        // did resolve, silently proceeding with no user data and breaking
        // downstream renders with no explanation to the user.
        showConnectionErrorScreen();
        return;
    }

    // Splash stays for at least 900ms so its entrance animation is always seen,
    // even when the network is fast — avoids an abrupt flash-then-gone feel.
    const elapsed = performance.now() - splashStart;
    if (elapsed < 900) await new Promise(r => setTimeout(r, 900 - elapsed));
    const splash = document.getElementById('splash');
    splash.classList.add('out');
    setTimeout(() => splash.remove(), 550);

    showOnboarding(async () => {
        const joinCheck = await apiGet(`user?action=checkJoin&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        if (joinCheck.joined) startApp();
        else showJoinGate({ leftAfterVerifying: joinCheck.leftAfterVerifying }, startApp);
    });
}

// ⚠️ FIX — pure canvas+screen+locale+timezone+cores fingerprinting collides
// across DIFFERENT physical devices when the hardware/software is common
// (same cheap Android model, same GPU, same Asia/Dhaka timezone, same bn/en
// locale — exactly the typical profile for our user base). That made the
// "device already in use" gate hard-block genuinely different people on
// genuinely different phones, which is what was being reported as false
// account suspensions.
//
// Fix: mix in a random, install-scoped ID that's generated once and
// persisted in localStorage. This is the dominant entropy source now — two
// physically identical phones will still get different fingerprints because
// each one rolled its own random ID on first launch. localStorage clears if
// the user clears app data / reinstalls, which starts a "new device" for
// gating purposes — same trade-off every app with this pattern accepts.
function getOrCreateInstallId() {
    try {
        const KEY = 'nt_install_id';
        let id = localStorage.getItem(KEY);
        if (!id) {
            id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));
            localStorage.setItem(KEY, id);
        }
        return id;
    } catch { return ''; } // localStorage unavailable — falls back to the weaker hardware-only signal below
}

async function generateDeviceFingerprint() {
    try {
        const parts = [];
        parts.push(getOrCreateInstallId()); // dominant entropy source, see note above
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 200; canvas.height = 50;
        ctx.textBaseline = 'top'; ctx.font = '14px Arial'; ctx.fillStyle = '#f60'; ctx.fillRect(0, 0, 100, 20);
        ctx.fillStyle = '#069'; ctx.fillText('NEWTUBE-fp', 2, 15);
        parts.push(canvas.toDataURL());
        parts.push(screen.width + 'x' + screen.height + 'x' + screen.colorDepth);
        parts.push(navigator.language || '');
        parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
        parts.push(navigator.hardwareConcurrency || '');
        const data = new TextEncoder().encode(parts.join('|||'));
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch { return null; }
}

// ⚠️ NEW — absolute last-resort safety net. If ANY future script (ad SDK or
// otherwise) ever blocks parsing again, or init() throws something not
// caught above, this guarantees the user is never stuck on the static "92%"
// splash forever — after 20s, if the splash is still there, force the
// connection-error/retry screen.
setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash && !splash.classList.contains('out')) showConnectionErrorScreen();
}, 20000);

init();
</script>

</body>
</html>
