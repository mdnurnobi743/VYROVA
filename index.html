const tg = window.Telegram?.WebApp;
if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    // Ivory chrome so Telegram's header / bottom bar blend into the cloud background
    try { tg.setHeaderColor('#F4F1E6'); } catch (e) {}
    try { tg.setBackgroundColor('#F4F1E6'); } catch (e) {}
    try { tg.setBottomBarColor('#F4F1E6'); } catch (e) {}
}

// ⚠️ FIX — "Open in Tonkeeper" was a plain `<a href="${deepLink}">`. Inside
// Telegram's in-app WebView, clicking a bare <a> navigates the WebView's
// OWN top-level frame (i.e. tries to replace the Mini App itself) instead
// of handing the URL off to the OS/Telegram-app link handler. app.tonkeeper.com
// then internally redirects toward a `ton://` intent to hand off to the
// Tonkeeper app — a scheme the Mini App's own WebView doesn't know how to
// navigate to — so the WebView throws net::ERR_UNKNOWN_URL_SCHEME and is
// left showing that error in place of the Mini App. The fix is to never let
// the WebView navigate itself: always route external links through
// `Telegram.WebApp.openLink()`, which Telegram intercepts and opens in the
// system browser / native app instead of the Mini App's own frame.
function openTonkeeperLink(url) {
    if (!url) return;
    if (tg?.openLink) {
        try { tg.openLink(url, { try_instant_view: false }); return; } catch (e) {}
    }
    // Fallback for testing outside Telegram (plain mobile/desktop browser).
    window.open(url, '_blank', 'noopener');
}

// ⚠️ SECURITY: USER_ID/FIRST_NAME/USERNAME here are for DISPLAY ONLY (cosmetic).
// They are never sent to the backend as a trusted identity — every API call
// sends the raw signed `tg.initData` string instead, and the server verifies
// it cryptographically (see lib/telegramAuth.js) before trusting any user id.
// This prevents anyone from forging requests with someone else's userId.
let USER_ID = null, FIRST_NAME = 'User', USERNAME = 'N/A', PHOTO_URL = '', startParam = null;
let TG_INIT_DATA = tg?.initData || '';

function hydrateDisplayUserFields() {
    TG_INIT_DATA = tg?.initData || ''; // re-read fresh each time — Telegram's bridge can deliver this late
    const u = tg?.initDataUnsafe?.user;
    if (!u || !TG_INIT_DATA) return false;
    USER_ID = String(u.id);
    FIRST_NAME = u.first_name || 'User';
    USERNAME = u.username || 'N/A';
    PHOTO_URL = (typeof u.photo_url === 'string' && /^https:\/\//.test(u.photo_url)) ? u.photo_url : ''; // Telegram profile photo (signed initData field)
    startParam = tg?.initDataUnsafe?.start_param || null;
    return true;
}

// ⚠️ NEW (big update) — small helpers. esc() = HTML-escape anything user-controlled
// (Telegram names, task titles) before it goes into innerHTML; tx() = translate a
// string from JS (native popups); avatarHtml() = Telegram photo with initial fallback.
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function tx(key, ...args) { return window.i18n ? window.i18n.t(key, ...args) : String(key).replace(/\{(\d+)\}/g, (_, n) => args[+n] ?? ''); }
function avatarHtml(name, size) {
    const initial = esc((name || '?').trim().charAt(0).toUpperCase() || '?');
    const img = PHOTO_URL ? `<img src="${esc(PHOTO_URL)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
    return `<span class="tg-avatar" style="${size ? `width:${size}px; height:${size}px; font-size:${Math.round(size * 0.4)}px;` : ''}">${initial}${img}</span>`;
}

function toast(message, type = 'info') {
    const host = document.getElementById('toast-host');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    host.appendChild(el);
    setTimeout(() => el.remove(), 3200);
}

// ══════════════════════════════════════════════════════════════
// API helpers — apiPost automatically attaches the signed Telegram
// initData to every request, so individual call sites never need to
// (and never should) pass a raw userId — the server derives it from
// the verified session instead.
// ⚠️ FIX — fetch() previously had NO timeout, so on a slow/dead mobile
// connection this could hang forever, leaving the user stuck on the splash
// screen's static "92%" bar with zero feedback and no way to recover short
// of force-closing the app. Now every call aborts after API_TIMEOUT_MS and
// resolves to {ok:false, error:'timeout'} instead of hanging indefinitely.
// ══════════════════════════════════════════════════════════════
const API_TIMEOUT_MS = 15000;
async function fetchWithTimeout(url, options) {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
    try {
        return await fetch(url, { ...options, signal: controller.signal });
    } finally { clearTimeout(t); }
}
async function apiPost(path, body = {}) {
    try {
        const res = await fetchWithTimeout(`${API_BASE}/${path}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...body, initData: TG_INIT_DATA }),
        });
        const data = await res.json();
        // ⚠️ NEW (big update) — server says the terms aren't accepted (e.g. terms version bumped mid-session) → show the terms screen again.
        if (data && data.error === 'terms_required' && state.user && !document.getElementById('terms-sheet')) {
            state.user.termsVersion = null;
            showOnboarding(() => {});
        }
        return data;
    } catch (e) { return { ok: false, error: e?.name === 'AbortError' ? 'timeout' : 'server_error' }; }
}
async function apiGet(path) {
    try { const res = await fetchWithTimeout(`${API_BASE}/${path}`); return await res.json(); }
    catch (e) { return { ok: false, error: e?.name === 'AbortError' ? 'timeout' : 'server_error' }; }
}
function fmtWTC(n) { return Math.floor(n || 0).toLocaleString('en-US'); }
function wtcToUsd(wtc) { return (wtc / WTC_PER_USD_DISPLAY).toFixed(4); }

// ══════════════════════════════════════════════════════════════
// PARTICLE BURST — lightweight canvas confetti for reward moments
// (claim lootbox, ad reward, task complete, withdraw, promo redeem).
// Self-contained, auto-clears after ~1s — never blocks interaction.
// ══════════════════════════════════════════════════════════════
const burstCanvas = document.getElementById('burst-canvas');
const burstCtx = burstCanvas.getContext('2d');
function resizeBurstCanvas() { burstCanvas.width = window.innerWidth; burstCanvas.height = window.innerHeight; }
resizeBurstCanvas();
let __burstRaf = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(__burstRaf); __burstRaf = requestAnimationFrame(resizeBurstCanvas); });

function triggerBurst(originEl) {
    const rect = originEl ? originEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
    const ox = rect.left + rect.width / 2;
    const oy = rect.top + rect.height / 2;
    const colors = ['#D3BC7C', '#E2D09A', '#8CA888', '#3C6A4B', '#FCFBF6'];
    const particles = Array.from({ length: 26 }, () => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 4.5;
        return { x: ox, y: oy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2, size: 3 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1 };
    });
    let frame = 0;
    function tick() {
        frame++;
        burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
        let alive = false;
        particles.forEach(p => {
            if (p.life <= 0) return;
            p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.life -= 0.022;
            if (p.life > 0) {
                alive = true;
                burstCtx.globalAlpha = Math.max(p.life, 0);
                burstCtx.fillStyle = p.color;
                burstCtx.beginPath(); burstCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); burstCtx.fill();
            }
        });
        burstCtx.globalAlpha = 1;
        if (alive && frame < 90) requestAnimationFrame(tick);
        else burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
    }
    tick();
}

// ══════════════════════════════════════════════════════════════
// COUNT-UP — animates a number from its current value to a new target
// ══════════════════════════════════════════════════════════════
function animateCountUp(el, from, to, duration = 700) {
    if (!el) return;
    const start = performance.now();
    const diff = to - from;
    function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 4);
        el.textContent = fmtWTC(from + diff * eased);
        if (t < 1) requestAnimationFrame(step);
        else el.textContent = fmtWTC(to);
    }
    requestAnimationFrame(step);
}

function switchTab(tabId) {
    const prev = state.activeTab;
    const first = !document.querySelector('.nav-item.active');
    state.activeTab = tabId;
    document.querySelectorAll('.nav-item, .nav-coin').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabId));
    const renderers = { home: renderHome, task: renderTaskTab, earn: renderEarnTab, refer: renderReferTab, profile: renderProfileTab };
    const root = document.getElementById('tab-content');
    root.dataset.enter = '1'; // lets renderHome() tell a real tab entrance from an in-place refresh
    renderers[tabId]();
    const dir = first ? 0 : (TAB_ORDER.indexOf(tabId) >= TAB_ORDER.indexOf(prev) ? 1 : -1);
    VyFX.enterTab(root, dir);
    VyFX.moveNavIndicator();
    VyFX.refresh();
    if (!first) window.scrollTo({ top: 0, behavior: 'auto' });
}

// Shared promo-redeem flow (ad-gate -> claim), used by BOTH the inline Home
// promo box and the openPromoModal() popup, so the anti-abuse "must watch an
// ad before the code is spent" behavior can't drift out of sync between them.
async function redeemPromoCode(code, btn, onSuccess) {
    if (!code) return toast('Please enter a code.', 'error');
    const originalLabel = btn.textContent;
    btn.textContent = 'Checking code...'; btn.disabled = true;

    // ⚠️ NEW — validate the code BEFORE showing an ad. Previously the ad
    // played no matter what, so an invalid/expired/already-used code still
    // cost the user a full ad watch before telling them it failed. This
    // check doesn't spend the code (see handleCheckPromo in api/earn.js) —
    // the real, atomic redemption still happens after the ad, below.
    const check = await apiPost('earn', { action: 'checkPromo', code });
    if (!check.ok) {
        toast(errorText(check.error), 'error');
        btn.textContent = originalLabel; btn.disabled = false;
        return;
    }

    btn.textContent = 'Checking...';
    const r = await apiPost('earn', { action: 'claimPromo', code });
    if (r.ok) {
        toast(`+${r.reward} VYRO COIN added!`, 'success');
        triggerBurst(btn);
        showCongrats(`+${r.reward} VYRO COIN`, '🎁', `≈ $${wtcToUsd(r.reward)} USD`);
        await refreshUser();
        onSuccess?.();
    } else {
        toast(errorText(r.error), 'error');
    }
    btn.textContent = originalLabel; btn.disabled = false;
}

// ⚠️ CHANGED — Display-only mirror of lib/constants.js's SPIN_FREE_COOLDOWN_HOURS
// (was SPIN_DAILY_FREE, a daily count — now a rolling cooldown).
const SPIN_FREE_COOLDOWN_HOURS_DISPLAY = 2;
const SPIN_SEGMENTS_DISPLAY = [100, 10, 20, 30, 40, 50, 60, 80];
const SPIN_WHEEL_GRADIENT = 'conic-gradient(from 0deg, #2F5A40 0deg 45deg, #8A6D2B 45deg 90deg, #4E7355 90deg 135deg, #234632 135deg 180deg, #8A6D2B 180deg 225deg, #4E7355 225deg 270deg, #2F5A40 270deg 315deg, #7A5F22 315deg 360deg)';

// ⚠️ NEW — how many ms remain before the next free spin is available, based
// on u.lastFreeSpinAt (absent/null = never spun free before = available now).
function spinCooldownMsRemaining(u) {
    // ⚠️ CHANGED — one spin per 2h TOTAL (free or bonus), so use the latest of both timestamps
    const lastMs = Math.max(u.lastFreeSpinAt ? new Date(u.lastFreeSpinAt).getTime() : 0, u.lastSpinAt ? new Date(u.lastSpinAt).getTime() : 0);
    if (!lastMs) return 0;
    const elapsed = Date.now() - lastMs;
    return Math.max(0, SPIN_FREE_COOLDOWN_HOURS_DISPLAY * 60 * 60 * 1000 - elapsed);
}
function fmtCooldown(ms) {
    const totalMin = Math.ceil(ms / 60000);
    const h = Math.floor(totalMin / 60), m = totalMin % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

// Wheel motion engine — transform-only rAF loop. Spins up immediately on tap and cruises while the
// server call is in flight; once the server has chosen the slice, stopAt() decelerates with an
// ease-out whose initial speed equals the cruising speed (no visible jolt) and lands exactly on it.
function createWheelSpinner(wheelEl, trailEl, pointerEl) {
    const VMAX = 960;              // deg/s at full speed
    let angle = 0, v = 0, raf = 0, last = 0, mode = 'up', ease = null, done = null, lastTick = 0;
    function apply() {
        const t = `translate3d(0,0,0) rotate(${angle.toFixed(2)}deg)`;
        wheelEl.style.transform = t;
        trailEl.style.transform = t;
        trailEl.style.opacity = (Math.min(1, v / VMAX) * 0.9).toFixed(2);
        const tk = Math.floor(angle / 45);
        if (tk !== lastTick) {
            lastTick = tk;
            if (v > 70) { pointerEl.classList.remove('tick'); void pointerEl.offsetWidth; pointerEl.classList.add('tick'); }
        }
    }
    function end() { cancelAnimationFrame(raf); raf = 0; const d = done; done = null; if (d) d(); }
    function frame(now) {
        if (!wheelEl.isConnected) { end(); return; }          // modal was closed mid-spin
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        if (mode === 'up') { v = Math.min(VMAX, v + 2600 * dt); angle += v * dt; }
        else if (mode === 'down') {
            const t = Math.min(1, (now - ease.t0) / ease.T);
            angle = ease.A0 + ease.D * (1 - Math.pow(1 - t, 3));
            v = (3 * ease.D / ease.T) * Math.pow(1 - t, 2);
            if (t >= 1) { v = 0; apply(); trailEl.style.opacity = 0; end(); return; }
        }
        apply();
        raf = requestAnimationFrame(frame);
    }
    function decelerate(D, T) {
        mode = 'down';
        return new Promise((resolve) => { done = resolve; ease = { A0: angle, D, T, t0: performance.now() }; });
    }
    return {
        start() { last = performance.now(); raf = requestAnimationFrame(frame); },
        // land with slice-centre rotation `targetMod` (deg, 0-360)
        stopAt(targetMod) {
            const v0 = Math.max(v, 360);
            const D0 = v0 * 4.2 / 3;
            const D = D0 + ((((targetMod - (angle + D0)) % 360) + 360) % 360);
            return decelerate(D, 3 * D / v0 * 1000);
        },
        halt() { const T = 0.9; return decelerate(Math.max(v, 60) * T / 3, T * 1000); },
    };
}

let spinBusy = false; // blocks a second spin request while one is running (animation + server call)

    }).join('');

// ⚠️ CHANGED — requests a signed spinStart token, then claims the spin (unchanged server flow).
// The wheel starts turning the instant the user taps; the reward is only revealed after the
// server has answered ok and the wheel has landed on the slice the server chose.
async function performSpin(btn) {
    if (spinBusy) return;
    spinBusy = true;
    btn.disabled = true;
    btn.classList.add('is-busy');
    const originalHtml = btn.innerHTML;
    btn.innerHTML = 'Spinning...';

    const wrap = document.getElementById('sw-wrap');
    const wheelEl = document.getElementById('spin-wheel-el');
    const sp = createWheelSpinner(wheelEl, document.getElementById('sw-trail'), document.getElementById('sw-pointer'));
    wrap.classList.add('is-spinning');
    VyFX.haptic('light');
    sp.start();

    const abort = async (code) => {
        toast(errorText(code), 'error');
        await sp.halt();
        wrap.classList.remove('is-spinning');
        btn.disabled = false; btn.classList.remove('is-busy'); btn.innerHTML = originalHtml;
        spinBusy = false;
    };

    try {
        const startRes = await apiPost('earn', { action: 'spinStart' });
        if (!startRes.ok) return await abort(startRes.error);

        const r = await apiPost('earn', { action: 'spin', startTime: startRes.startTime, signature: startRes.signature });
        if (!r.ok) return await abort(r.error);

        const mid = r.segmentIndex * 45 + 22.5;
        const jitter = (Math.random() - 0.5) * 24;              // stays well inside the 45° slice
        await sp.stopAt((((360 - mid + jitter) % 360) + 360) % 360);
        wrap.classList.remove('is-spinning');
        btn.classList.remove('is-busy'); btn.innerHTML = '✓ Spin complete';

        toast(`🎉 You won ${r.reward} VYRO COIN!`, 'success');
        VyFX.haptic('success');
        const stillOpen = !!document.getElementById('spin-wheel-el');
        const refresh = (async () => {
            try { await refreshUser(); } catch (e) {}
            if (state.activeTab === 'home') renderHome(); else if (state.activeTab === 'profile') renderProfileTab();
        })();
        if (stillOpen) {
            // re-render the modal (fresh cooldown / spin counts) only when the user taps "Awesome"
            showSpinReveal(wrap, r.reward, async () => { await refresh; if (document.getElementById('sw-wrap')) openSpinWheelModal(); });
        }
        await refresh;
    } catch (e) {
        wrap.classList.remove('is-spinning');
        btn.disabled = false; btn.classList.remove('is-busy'); btn.innerHTML = originalHtml;
    } finally {
        spinBusy = false;
    }
}

                ${pfTile({ icon: 'withdraw', label: 'Total withdrawn', value: '<i class="skel pf-skel"></i>', valueId: 'pf-withdrawn', gold: true })}
            </div>

            <div class="pf-section-head anim-in-4"><span>Wallet</span></div>
            <div class="pf-list anim-in-4">
                ${pfRow({ id: 'pf-go-withdraw', icon: 'withdraw', title: 'Withdraw', sub: 'Cash out your VYRO COIN' })}
                ${pfRow({ id: 'pf-go-history', icon: 'history', gold: true, title: 'Withdraw History', sub: 'Track every request' })}
                ${pfRow({ id: 'pf-go-redeem', icon: 'redeem', title: 'Redeem', sub: 'Enter a promo code' })}
            </div>

            <div class="pf-section-head anim-in-5"><span>Account</span></div>
            <div class="pf-list anim-in-5">
                ${pfRow({ id: 'pf-copy-id', icon: 'id', title: 'Ledger ID', sub: `<span class="mono-num" translate="no">${esc(USER_ID)}</span>`, end: copyEnd })}
                ${pfRow({ id: 'pf-go-lang', icon: 'globe', gold: true, title: 'Language', sub: 'Choose your language' })}
            </div>

            <div class="pf-section-head anim-in-5"><span>Community</span></div>
            <div class="pf-list anim-in-5">
                ${pfRow({ id: 'pf-go-official', icon: 'channel', gold: true, title: 'Official Channel', sub: 'Join our channel', end: extEnd })}
                ${pfRow({ id: 'pf-go-community', icon: 'people', title: 'Community', sub: 'Chat with other members', end: extEnd })}
                ${pfRow({ id: 'pf-go-pay', icon: 'pay', gold: true, title: 'Payment Channel', sub: 'Latest payment proof', end: extEnd })}
                ${pfRow({ id: 'pf-go-board', icon: 'trophy', title: 'Leaderboard', sub: 'Top earners ranking' })}
                ${pfRow({ id: 'pf-go-contest', icon: 'medal', gold: true, title: 'Weekly Contest', sub: 'Win exciting rewards' })}
            </div>
        </div>`;

    const $ = (id) => document.getElementById(id);
    const balEl = $('pf-balance-num');
    VyFX.fitNumber(balEl, 40, 24);
    if (enter && bal > 0) animateCountUp(balEl, 0, bal, 1100); else balEl.textContent = fmtWTC(bal);

    $('pf-withdraw').onclick = openWithdrawModal;
    $('pf-go-withdraw').onclick = openWithdrawModal;
    $('pf-go-history').onclick = openHistoryModal;
    $('pf-go-redeem').onclick = openPromoModal;
    $('pf-go-lang').onclick = openLanguageModal;
    $('pf-copy-id').onclick = () => { navigator.clipboard.writeText(String(USER_ID)); toast('Ledger ID copied!', 'success'); VyFX.haptic('success'); };
    $('pf-go-official').onclick = () => window.open(OFFICIAL_CHANNEL_URL, '_blank');
    $('pf-go-community').onclick = () => window.open(COMMUNITY_GROUP_URL, '_blank');
    $('pf-go-pay').onclick = () => window.open(PAYMENT_PROOF_GROUP_URL, '_blank');
    $('pf-go-board').onclick = openLeaderboardModal;
    $('pf-go-contest').onclick = openWeeklyContestModal;
    VyFX.refresh();

    // Withdrawn total: sums the user's approved requests from the existing history
    // endpoint (same one the History sheet uses). Skeleton -> value, "—" on failure.
    (async () => {
        let text = '—';
        try {
            const r = await apiGet(`withdraw?action=history&initData=${encodeURIComponent(TG_INIT_DATA)}`);
            if (r.ok) {
                const sum = (r.history || []).filter(h => h.status === 'approved').reduce((a, h) => a + Number(h.cashAmount ?? h.usdAmount ?? 0), 0);
                text = '$' + sum.toFixed(2);
            }
        } catch (e) {}
        const el = document.getElementById('pf-withdrawn');
        if (!el) return; // navigated away
        el.textContent = text;
        el.classList.add('count-pop');
    })();
}

// ══════════════════════════════════════════════════════════════
// WITHDRAW MODAL — single form. User types a VYRO COIN amount, picks a method
// (first withdrawal only; the wallet is locked afterwards), sees a live
// "you receive" + requirements checklist, and submits. Mirrors api/withdraw.js
// (the server is the source of truth; this is the display/validation copy).
// ══════════════════════════════════════════════════════════════
const WITHDRAW_METHODS_UI = {
    binance:   { label: 'Binance UID', currency: 'USDT', placeholder: 'Enter your Binance UID',
                 icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 3-3 3-3-3 3-3zM12 16l3 3-3 3-3-3 3-3zM2 12l3-3 3 3-3 3-3-3zM16 12l3-3 3 3-3 3-3-3z"/></svg>' },
    tonkeeper: { label: 'Tonkeeper Address', currency: 'USDT', placeholder: 'UQ... wallet address',
                 icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zM8 10l4-4 4 4M12 6v10"/></svg>' },
};

function calcNetUsdDisplay(wtc) {
    const gross = wtc / WTC_PER_USD_DISPLAY;
    const afterFirstFee = gross * (1 - WITHDRAW_FEE_PERCENT_DISPLAY / 100);
    const net = afterFirstFee * (1 - WITHDRAW_SECOND_FEE_PERCENT_DISPLAY / 100);
    return net;
}

function openWithdrawModal() {
    let method = 'binance';
    let status = null;       // full GET ?action=status response
    let loadFailed = false;
    let withdrawalsOpen = true;

    function renderClosed() {
        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this)this.remove()">
                <div class="sheet anim-in" style="position:relative; overflow:hidden;">
                    <div class="jg-glow" style="opacity:0.5;"></div>
                    <div class="sheet-handle" style="position:relative; z-index:1;"></div>
                    <div style="position:relative; z-index:1; text-align:center; padding:12px 4px 4px;">
                        <div style="font-size:34px; margin-bottom:10px;">🔒</div>
                        <div class="section-title" style="margin-bottom:8px;">Withdrawals are closed</div>
                        <div class="muted" style="font-size:13px; line-height:1.6; margin-bottom:20px;">New withdraw requests aren't being accepted right now. Any request you already submitted before this will still be reviewed and paid normally.</div>
                        <button class="btn btn-outline" id="wd-closed-ok" style="width:100%;">Close</button>
                    </div>
                </div>
            </div>`;
        const okBtn = document.getElementById('wd-closed-ok');
        if (okBtn) okBtn.onclick = () => { document.getElementById('modal-root').innerHTML = ''; };
    }

    // ⚠️ NEW (big update) — promised payout window (server value wins, constants are the fallback)
    function procHours() {
        return status?.processingHours || { min: WITHDRAW_PROCESS_MIN_HOURS_DISPLAY, max: WITHDRAW_PROCESS_MAX_HOURS_DISPLAY };
    }

    // ⚠️ NEW (big update) — "double-check your wallet" step shown before EVERY
    // withdrawal. Layered on document.body (not modal-root) so the withdraw form
    // underneath keeps everything the user typed if they go back to edit.
    function confirmWallet(methodKey, details, wtc) {
        return new Promise((resolve) => {
            document.getElementById('wd-confirm-layer')?.remove();
            const layer = document.createElement('div');
            layer.id = 'wd-confirm-layer';
            layer.className = 'overlay';
            layer.style.zIndex = '120';
            layer.style.alignItems = 'center';
            layer.innerHTML = `
                <div class="sheet anim-in" style="border-radius:18px; padding:22px 18px 18px; max-height:calc(var(--ovh, 100vh) * 0.9); overflow-y:auto;">
                    <div style="text-align:center; font-size:34px; margin-bottom:6px;">🔎</div>
                    <div class="section-title" style="justify-content:center; margin-bottom:6px;">Double-check your wallet</div>
                    <div class="muted" style="font-size:12.5px; line-height:1.6; text-align:center; margin-bottom:14px;">Your money will be sent to the address below. Check every character — payments sent to a wrong address cannot be recovered.</div>
                    <div class="field-label" style="margin-top:0;">Method</div>
                    <div style="font-weight:600; font-size:14px; margin-bottom:10px;">${WITHDRAW_METHODS_UI[methodKey]?.label || esc(methodKey)}</div>
                    <div class="field-label" style="margin-top:0;">Address / UID</div>
                    <div class="wd-confirm-addr mono-num" translate="no">${esc(details)}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
                        <span class="muted" style="font-size:13px;">You receive</span>
                        <span class="mono-num" style="font-size:17px; font-weight:700; color:var(--money);">$${calcNetUsdDisplay(wtc).toFixed(4)}</span>
                    </div>
                    <div style="font-size:11.5px; margin-top:6px; color:var(--pending);">⏱ Withdrawals are paid within ${procHours().min}–${procHours().max} hours after you submit.</div>
                    <label style="display:flex; align-items:flex-start; gap:10px; margin:14px 0; font-size:13px; color:var(--ink-muted);">
                        <input type="checkbox" id="wd-confirm-box" style="margin-top:3px;"> <span>I have carefully checked my wallet address and it is correct.</span>
                    </label>
                    <button class="btn btn-money" id="wd-confirm-go" disabled style="margin-bottom:10px;">Confirm & Withdraw</button>
                    <button class="btn btn-outline" id="wd-confirm-back">Go back</button>
                </div>`;
            document.body.appendChild(layer);
            const box = layer.querySelector('#wd-confirm-box');
            const go = layer.querySelector('#wd-confirm-go');
            const finish = (ok) => { layer.remove(); resolve(ok); };
            box.onchange = () => { go.disabled = !box.checked; };
            go.onclick = () => finish(true);
            layer.querySelector('#wd-confirm-back').onclick = () => finish(false);
            layer.onclick = (e) => { if (e.target === layer) finish(false); };
        });
    }

    function reqLine(label, met, detail) {
        return `
        <div style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:6px; color:${met ? 'var(--success)' : 'var(--pending)'};">
            <span>${met ? '✅' : '⏳'}</span><span>${label}${detail ? ` <span class="muted" style="color:inherit; opacity:0.85;">${detail}</span>` : ''}</span>
        </div>`;
    }

    function render() {
        // ⚠️ FIX — render() is called once synchronously (see the bottom of
        // openWithdrawModal) BEFORE loadStatus() has resolved, so `status`
        // is still null on that first call. Every field below reads from
        // `status` unconditionally (status.lockedWallet, status.referralRequirement,
        // etc.) with no optional-chaining, so without this guard the very
        // first render() would throw immediately. Shows a lightweight
        // skeleton instead; loadStatus() calls render() again once real
        // data arrives.
        if (!status) {
            document.getElementById('modal-root').innerHTML = `
                <div class="overlay" onclick="if(event.target===this)this.remove()">
                    <div class="sheet anim-in" style="max-height:calc(var(--ovh, 100vh) * 0.88);">
                        <div class="sheet-handle"></div>
                        <div class="section-title" style="margin-bottom:14px;">Withdraw VYRO COIN</div>
                        <div class="skel" style="height:56px; width:100%; margin-bottom:14px;"></div>
                        <div class="skel" style="height:44px; width:100%; margin-bottom:14px;"></div>
                        <div class="skel" style="height:44px; width:100%; margin-bottom:14px;"></div>
                        <div class="skel" style="height:48px; width:100%;"></div>
                    </div>
                </div>`;
            return;
        }
        const u = state.user || {};
        const wtcBalance = u.wtcBalance || 0;
        const m = WITHDRAW_METHODS_UI[method];

        // Re-renders (gateway switch, status refresh) happen inside an already-open sheet:
        // skip the entrance animation + overlay fade (that replay was the visible "glitch"),
        // and keep what the user already typed.
        const modalRoot = document.getElementById('modal-root');
        const alreadyOpen = !!modalRoot.querySelector('.overlay .sheet'); // includes the loading skeleton
        const keepAmount = alreadyOpen ? (document.getElementById('wd-amount')?.value || '') : '';
        const keepScroll = alreadyOpen ? (modalRoot.querySelector('.sheet > div[style*="overflow-y"]')?.scrollTop || 0) : 0;

        modalRoot.innerHTML = `
            <div class="overlay${alreadyOpen ? ' wd-static' : ''}" onclick="if(event.target===this)this.remove()">
                <div class="sheet anim-in" style="max-height:calc(var(--ovh, 100vh) * 0.88); display:flex; flex-direction:column; position:relative; overflow:hidden;">
                    <div class="jg-glow" style="opacity:0.5;"></div>
                    <div class="sheet-handle" style="position:relative; z-index:1;"></div>
                    <div class="section-title" style="margin-bottom:14px; position:relative; z-index:1;">Withdraw VYRO COIN</div>

                    <div style="overflow-y:auto; flex:1 1 auto; min-height:0; position:relative; z-index:1; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;">
                        ${status.lockedWallet ? `
                            <!-- ⚠️ NEW — wallet lock (see WALLET_CHANGE_PENALTY_PERCENT,
                                 lib/constants.js). Once a user's first withdrawal sets
                                 this, every withdrawal after just shows it read-only —
                                 no re-typing, no method switch. Changing it requires the
                                 one-time admin-mediated flow (Telegram bot), not this UI. -->
                            <div class="field-label" style="margin-top:0;">Withdrawing to</div>
                            <div style="display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:12px; background:var(--glass-bg); border:1px solid var(--glass-border); margin-bottom:14px;">
                                <div style="font-size:20px;">${WITHDRAW_METHODS_UI[status.lockedWallet.method]?.icon || '💳'}</div>
                                <div style="flex:1; min-width:0;">
                                    <div style="font-size:12.5px; font-weight:600;">${WITHDRAW_METHODS_UI[status.lockedWallet.method]?.label || status.lockedWallet.method}</div>
                                    <div class="muted mono-num" style="font-size:11.5px; word-break:break-all;">${status.lockedWallet.address}</div>
                                </div>
                            </div>
                            <div class="muted" style="font-size:11px; margin:-8px 0 14px;">🔒 Locked to your first withdrawal — contact support in the bot if this address is wrong.</div>
                        ` : `
                            <div class="field-label" style="margin-top:0;">Select gateway</div>
                            <div class="wd-gateways" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;">
                                ${Object.entries(WITHDRAW_METHODS_UI).map(([key, cfg]) => `
                                    <button class="btn ${method === key ? 'btn-primary' : 'btn-outline'}" data-method="${key}" style="display:flex; align-items:center; justify-content:center; gap:7px; height:56px; flex-direction:column; font-size:12px;">
                                        ${cfg.icon}${cfg.label.split(' ')[0]}
                                    </button>`).join('')}
                            </div>

                            <div class="field-label">${m.label}</div>
                            <input class="field-input" id="wd-details" placeholder="${m.placeholder}">
                            <div class="wd-notice" role="note"><span class="wd-notice-ico" aria-hidden="true">⚠️</span><span class="wd-notice-txt">This becomes your permanent withdrawal wallet — double-check it before submitting.</span></div>
                        `}

                        <div class="field-label">Amount (VYRO COIN) — minimum ${fmtWTC(MIN_WITHDRAW_WTC)}</div>
                        <div style="display:flex; gap:8px;">
                            <input class="field-input" id="wd-amount" type="number" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="${MIN_WITHDRAW_WTC}" style="flex:1;">
                            <button class="btn btn-outline" id="wd-max" style="width:auto; padding:0 16px;">MAX</button>
                        </div>
                        <div class="muted wd-hint">${fmtWTC(WTC_PER_USD_DISPLAY)} VYRO COIN = 1 USDT · Balance: <span class="mono-num">${fmtWTC(wtcBalance)} VYRO COIN</span></div>

                        ${(status && status.withdrawRequirements.accountAgeRequiredHours <= 0 && status.referralRequirement.isFreePhase) ? '' : `<div class="card" style="margin-top:14px; padding:12px 14px;">
                            ${!status ? `<div class="muted" style="font-size:12.5px; text-align:center; padding:6px 0;">${loadFailed ? "Couldn't load — try again." : 'Loading requirements...'}</div>` : `
                                ${status.withdrawRequirements.accountAgeRequiredHours > 0 ? reqLine(`Account at least ${status.withdrawRequirements.accountAgeRequiredHours} hours old`, status.withdrawRequirements.accountAgeMet, status.withdrawRequirements.accountAgeMet ? '' : `(${status.withdrawRequirements.accountAgeHoursRemaining}h left)`) : ''}
                                ${status.referralRequirement.isFreePhase
                                    ? '' // free phase: the referral line is hidden until the free withdrawals are used up
                                    // Referrals needed scale with the AMOUNT typed (updateReceiveAndSubmit
                                    // recomputes this live). Referrals can't be bought anymore — invite friends.
                                    : reqLine('Valid referrals available', true, `(${status.referralRequirement.validReferralsAvailable} available, 1 per every $${status.referralRequirement.usdPerReferral})`)}
                            `}
                        </div>`}

                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--border);">
                            <span class="muted" style="font-size:13px;">You receive</span>
                            <span id="wd-receive" class="mono-num" style="font-size:18px; font-weight:700; color:var(--money);">$0.0000</span>
                        </div>
                        <div class="muted" style="font-size:10.5px; margin-top:4px;">${WITHDRAW_SECOND_FEE_PERCENT_DISPLAY > 0 ? `Fees: ${WITHDRAW_FEE_PERCENT_DISPLAY}% + ${WITHDRAW_SECOND_FEE_PERCENT_DISPLAY}%, taken together at withdraw time.` : `Withdrawal fee: ${WITHDRAW_FEE_PERCENT_DISPLAY}%`}</div>
                        <div style="font-size:11.5px; margin-top:8px; color:var(--pending);">⏱ Withdrawals are paid within ${procHours().min}–${procHours().max} hours after you submit.</div>
                    </div>

                    <button class="btn btn-money" style="margin-top:14px; position:relative; z-index:1;" id="wd-submit" disabled>Loading...</button>
                    <a href="${PAYMENT_PROOF_GROUP_URL}" target="_blank" rel="noopener" id="wd-live-logs" style="display:block; text-align:center; margin-top:12px; font-size:13px; font-weight:600; color:var(--money); text-decoration:underline; position:relative; z-index:1;">View live payout logs</a>
                </div>
            </div>`;

        if (keepAmount) document.getElementById('wd-amount').value = keepAmount;
        if (keepScroll) { const sc = modalRoot.querySelector('.sheet > div[style*="overflow-y"]'); if (sc) sc.scrollTop = keepScroll; }
        document.querySelectorAll('[data-method]').forEach(btn => {
            btn.onclick = () => { if (method === btn.dataset.method) return; method = btn.dataset.method; render(); };
        });
        document.getElementById('wd-max').onclick = () => {
            // ⚠️ NEW — for a first-time (free) withdrawal, MAX shouldn't
            // fill in more than the free cap, or it'd just disable the
            // submit button immediately.
            const cap = (status?.referralRequirement?.isFreePhase)
                ? Math.min(wtcBalance, status.referralRequirement.freeWithdrawMaxWtc)
                : wtcBalance;
            document.getElementById('wd-amount').value = Math.floor(cap);
            updateReceiveAndSubmit();
        };
        document.getElementById('wd-amount').oninput = updateReceiveAndSubmit;
        document.getElementById('wd-submit').onclick = submitWithdraw;
        document.getElementById('wd-live-logs').onclick = (e) => { e.preventDefault(); const tg = window.Telegram?.WebApp; if (tg?.openTelegramLink) tg.openTelegramLink(PAYMENT_PROOF_GROUP_URL); else window.open(PAYMENT_PROOF_GROUP_URL, '_blank'); };
        updateReceiveAndSubmit();
    }

    function updateReceiveAndSubmit() {
        const amountEl = document.getElementById('wd-amount');
        const btn = document.getElementById('wd-submit');
        const receiveEl = document.getElementById('wd-receive');
        if (!amountEl || !btn) return;

        // FIX — write to the DOM only when the text really changed: rewriting identical text on
        // every keystroke forced needless re-layout/repaint inside the open sheet (typing flicker).
        const setTxt = (el, t) => { if (el.textContent !== t) el.textContent = t; };
        const wtc = Math.floor(parseFloat(amountEl.value) || 0);
        setTxt(receiveEl, `$${calcNetUsdDisplay(wtc).toFixed(4)}`);

        if (!status) { btn.disabled = true; setTxt(btn, loadFailed ? 'Retry' : 'Loading...'); return; }

        const u = state.user || {};
        const wtcBalance = u.wtcBalance || 0;
        const reqOk = status.withdrawRequirements.adsMet && status.withdrawRequirements.accountAgeMet !== false;
        // ⚠️ CHANGED — was a flat "1 valid referral" check (status.referralRequirement.met).
        // Now computed live from the CURRENT typed amount, same formula the
        // server re-verifies at submit (requiredReferralsForUsd, lib/constants.js).
        const grossUsd = wtc / WTC_PER_USD_DISPLAY;
        const referralsNeeded = status.referralRequirement.isFreePhase
            ? 0
            : Math.max(1, Math.ceil(grossUsd / status.referralRequirement.usdPerReferral));
        const refOk = status.referralRequirement.isFreePhase || status.referralRequirement.validReferralsAvailable >= referralsNeeded;

        if (loadFailed) { btn.disabled = false; setTxt(btn, 'Retry'); return; }
        if (status.withdrawPending) { btn.disabled = true; setTxt(btn, 'A request is already pending'); return; }
        if (wtc < MIN_WITHDRAW_WTC) { btn.disabled = true; setTxt(btn, `Minimum ${fmtWTC(MIN_WITHDRAW_WTC)} VYRO COIN`); return; }
        if (wtc > wtcBalance) { btn.disabled = true; setTxt(btn, 'Insufficient VYRO COIN balance'); return; }
        // ⚠️ NEW — the free first withdrawal is capped; catch it client-side
        // too so the button disables instead of letting the user submit and
        // only then find out from the server.
        if (status.referralRequirement.isFreePhase && wtc > status.referralRequirement.freeWithdrawMaxWtc) {
            btn.disabled = true; setTxt(btn, `Max $${status.referralRequirement.freeWithdrawMaxUsd} (${fmtWTC(status.referralRequirement.freeWithdrawMaxWtc)} VYRO COIN) per withdrawal`); return;
        }
        if (!reqOk) { btn.disabled = true; setTxt(btn, 'Complete requirements above'); return; }
        if (!refOk) {
            btn.disabled = true;
            setTxt(btn, `Need ${referralsNeeded} valid referral${referralsNeeded === 1 ? '' : 's'} (have ${status.referralRequirement.validReferralsAvailable})`);
            return;
        }
        btn.disabled = false;
        setTxt(btn, `Withdraw ${fmtWTC(wtc)} VYRO COIN`);
    }

    async function loadStatus() {
        const r = await apiGet(`withdraw?action=status&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        if (!r.ok) {
            loadFailed = true;
            updateReceiveAndSubmit();
            return;
        }
        if (r.withdrawalsOpen === false) {
            withdrawalsOpen = false;
            renderClosed();
            return;
        }
        loadFailed = false;
        status = r;
        // ⚠️ NEW — if a wallet is already locked, sync the selector to it
        // (though it won't be shown/editable — see render() below).
        if (status.lockedWallet) method = status.lockedWallet.method;
        render();
    }

    async function submitWithdraw() {
        // ⚠️ CHANGED — when a wallet is already locked, there's no #wd-details
        // input in the DOM at all (see render() above) — use the locked
        // address directly. The server ignores/overrides this anyway (see
        // api/withdraw.js), but sending it keeps this function simple.
        const details = status.lockedWallet ? status.lockedWallet.address : document.getElementById('wd-details').value.trim();
        const wtcAmount = Math.floor(parseFloat(document.getElementById('wd-amount').value) || 0);
        if (loadFailed) { loadStatus(); return; }
        if (!details) return toast('Please enter your address/UID.', 'error');
        if (!status.lockedWallet && !/^[A-Za-z0-9_\-:.+\/=]{5,100}$/.test(details)) return toast(errorText('invalid_address'), 'error');
        if (!wtcAmount) return toast('Please enter an amount.', 'error');

        // ⚠️ NEW (big update) — user must look at the wallet address before money leaves.
        const okToSend = await confirmWallet(status.lockedWallet ? status.lockedWallet.method : method, details, wtcAmount);
        if (!okToSend) return;

        const btn = document.getElementById('wd-submit');
        btn.textContent = 'Submitting...'; btn.disabled = true;
        const r = await apiPost('withdraw', { method, details, wtcAmount });
        if (r.ok) {
            toast(`Withdraw request submitted — you'll be paid within ${procHours().min}–${procHours().max} hours.`, 'success');
            triggerBurst(btn);
            setTimeout(() => { document.getElementById('modal-root').innerHTML = ''; }, 200);
            await refreshUser();
            if (state.activeTab === 'home') renderHome(); else if (state.activeTab === 'profile') renderProfileTab();
        } else {
            toast(r.message || errorText(r.error), 'error');
            await loadStatus();
        }
    }

    render();
    loadStatus();
}

// ── fullscreen game host ──
// The game only REPORTS its result (postMessage). The server (earn.js › miniBotStart / miniBotClaim)
// issues a signed run token, re-validates the result and credits the wallet — see lib/miniBot.js.
let earnGame = null; // { frame, root, run, onMsg, onBack }
function openEarnGame(id) {
    const g = EARN_GAMES.find(x => x.id === id);
    if (!g || earnGame) return;
    const host = document.createElement('div');
    host.className = 'game-host';
    host.innerHTML = '<div class="game-loading">Loading…</div>';
    const frame = document.createElement('iframe');
    frame.className = 'game-frame';
    frame.title = g.name;
    frame.setAttribute('allow', 'autoplay; vibrate');
    frame.src = g.src + '?embed=1&v=' + Date.now();
    host.appendChild(frame);
    document.body.appendChild(host);
    document.documentElement.classList.add('game-open');

    const post = (m) => { try { frame.contentWindow.postMessage(Object.assign({ vyrova: true }, m), location.origin); } catch (e) {} };
    const ctx = { frame, host, run: null };
    ctx.onMsg = async (e) => {
        if (e.source !== frame.contentWindow || e.origin !== location.origin || !e.data || e.data.vyrova !== true) return;
        const d = e.data;
        if (d.type === 'run-start') {
            ctx.run = apiPost('earn', { action: 'miniBotStart' }); // token request runs while the player flies
        } else if (d.type === 'run-end') {
            const coins = Math.max(0, Math.floor(Number(d.coins) || 0));
            if (coins <= 0) return post({ type: 'claim-result', ok: true, reward: 0 });
            const tok = ctx.run ? await ctx.run : null;
            ctx.run = null;
            if (!tok || !tok.ok) return post({ type: 'claim-result', ok: false, error: (tok && tok.error) || 'no_run_token' });
            if (tok.paid === false) return post({ type: 'claim-result', ok: true, reward: 0, limitReached: true });
            const r = await apiPost('earn', { action: 'miniBotClaim', startTime: tok.startTime, signature: tok.signature, coins, bossKilled: !!d.bossKilled, score: Math.floor(Number(d.score) || 0) });
            if (r && r.ok && r.reward > 0) {
                if (state.user) { state.user.wtcBalance = typeof r.balance === 'number' ? r.balance : (state.user.wtcBalance || 0) + r.reward; }
                try { VyFX.haptic && VyFX.haptic('success'); } catch (e2) {}
            }
            post({ type: 'claim-result', ok: !!(r && r.ok), reward: r && r.reward, limitReached: !!(r && r.limitReached), error: r && r.error });
        } else if (d.type === 'exit') {
            closeEarnGame();
        }
    };
    window.addEventListener('message', ctx.onMsg);

    // Telegram: stop the swipe-down gesture from closing the app mid-game, dark chrome, native Back button exits the game
    try { tg?.disableVerticalSwipes?.(); } catch (e) {}
    try { tg?.setHeaderColor?.('#04030c'); tg?.setBackgroundColor?.('#04030c'); tg?.setBottomBarColor?.('#04030c'); } catch (e) {}
    ctx.onBack = () => closeEarnGame();
    try { tg?.BackButton?.show(); tg?.BackButton?.onClick(ctx.onBack); } catch (e) {}
    earnGame = ctx;
}
function closeEarnGame() {
    const ctx = earnGame; if (!ctx) return;
    earnGame = null;
    window.removeEventListener('message', ctx.onMsg);
    try { tg?.BackButton?.offClick(ctx.onBack); tg?.BackButton?.hide(); } catch (e) {}
    try { tg?.enableVerticalSwipes?.(); } catch (e) {}
    try { tg?.setHeaderColor?.('#F4F1E6'); tg?.setBackgroundColor?.('#F4F1E6'); tg?.setBottomBarColor?.('#F4F1E6'); } catch (e) {}
    ctx.frame.src = 'about:blank'; // stops the game loop + audio immediately
    ctx.host.remove();
    document.documentElement.classList.remove('game-open');
    if (state.activeTab === 'earn') refreshMiniBotRuns();
}

function goToTask(taskId, url, category, verifyType) {
    // Open the link first
    if (url) window.open(url, '_blank');

    // Then show the claim/verify sheet — user must actively press Claim
    const task = state.tasks.find(t => t._id === taskId);
    // ⚠️ CHANGED (this update) — was `category === 'channel'`. Now keyed off
    // verifyType so any category (Daily/Exclusive/Partner/Earning) can be an
    // API-verified (Telegram join) task, not just the dedicated Verify tab.
    const isVerified = verifyType === 'api';

    // ⚠️ NEW — issue a signed taskStart token the instant the sheet opens
    // (non-API-verified tasks only — API-verified tasks are independently
    // verified via real Telegram membership and don't need this). Stored in a
    // closure-scoped variable and sent along with the claim below — see
    // handleTaskStart/handleTaskComplete in api/earn.js for why.
    let taskToken = null;
    if (!isVerified) {
        apiPost('earn', { action: 'taskStart', taskId }).then(r => {
            if (r?.ok) taskToken = { startTime: r.startTime, signature: r.signature };
        });
    }

    document.getElementById('modal-root').innerHTML = `
        <div class="overlay" onclick="if(event.target===this)this.remove()">
            <div class="sheet anim-in">
                <div class="sheet-handle"></div>
                <div style="font-weight:600; font-size:16px; margin-bottom:6px;">${esc(task?.title || 'Task')}</div>
                <div class="muted" style="font-size:13px; margin-bottom:18px;">
                    ${isVerified
                        ? 'After joining the channel/group, tap Verify below. Our server will check your membership.'
                        : 'After completing the task above, tap Claim to receive your reward.'}
                </div>
                ${isVerified ? `
                    <button class="btn btn-signal" id="task-verify-btn" style="margin-bottom:10px;">
                        ✅ Verify Membership
                    </button>` : `
                    <button class="btn btn-primary" id="task-claim-btn" style="margin-bottom:10px;" disabled>
                        🎁 Claim in 5s
                    </button>`}
                <button class="btn btn-outline" onclick="document.getElementById('modal-root').innerHTML=''">
                    Cancel
                </button>
            </div>
        </div>`;

    const actionBtn = document.getElementById('task-verify-btn') || document.getElementById('task-claim-btn');
    if (actionBtn) {
        actionBtn.onclick = async () => {
            actionBtn.disabled = true;
            actionBtn.textContent = 'Checking...';
            await completeTask(taskId, taskToken);
        };
    }

    // ⚠️ Soft anti-abuse friction (matches the read→wait→claim pattern from
    // reference apps) — link-based tasks can't be server-verified (we can't
    // confirm someone actually visited an external site), so this at least
    // stops instant claim-without-clicking. It's not real verification, just
    // a reasonable minimum.
    const claimBtn = document.getElementById('task-claim-btn');
    if (claimBtn) {
        let remaining = 5; // ⚠️ CHANGED — was 10s (per admin request). See TASK_MIN_WAIT_SECONDS in lib/constants.js, lowered to match.
        const timer = setInterval(() => {
            remaining--;
            if (!claimBtn.isConnected) { clearInterval(timer); return; }
            if (remaining <= 0) {
                clearInterval(timer);
                claimBtn.disabled = false;
                claimBtn.innerHTML = '🎁 Claim Reward';
            } else {
                claimBtn.textContent = `🎁 Claim in ${remaining}s`;
            }
        }, 1000);
    }
}

async function completeTask(taskId, taskToken) {
    const r = await apiPost('earn', { action: 'taskComplete', taskId, startTime: taskToken?.startTime, signature: taskToken?.signature });
    document.getElementById('modal-root').innerHTML = ''; // close sheet
    if (r.ok) {
        toast(`+${r.rewardWtc} VYRO COIN added!`, 'success');
        triggerBurst(document.querySelector(`button[data-task="${taskId}"]`) || document.body);
        showCongrats(`+${r.rewardWtc} VYRO COIN`, '✅', `≈ $${wtcToUsd(r.rewardWtc)} USD`);
        await refreshUser();

        // ── Vanishes the completed task's card with an animation, then refreshes the list ──
        const refreshActiveTab = () => {
            if (state.activeTab === 'task') renderTaskTab();
        };
        const card = document.querySelector(`[data-task-card="${taskId}"]`);
        if (card) {
            card.classList.add('task-vanish');
            setTimeout(refreshActiveTab, 480);
        } else {
            refreshActiveTab();
        }
    }
    else if (r.alreadyDone) { toast('You already completed this task.', 'info'); }
    else if (r.error === 'not_member') { toast('Not a member yet — join first, then verify.', 'error'); }
    else { toast(errorText(r.error), 'error'); }
}

// ⚠️ NEW — "Create Task" button (Task tab). A user pays TON to publish
// their OWN task into the ⭐ Exclusive section. Payment is verified fully
// server-side/on-chain (api/payments.js (cron=checkDeposits)) — this modal
// only collects the task details, creates the order, and polls its

        if (pollTimer) clearInterval(pollTimer);
        if (countdownTimer) clearInterval(countdownTimer);
    }
    function close(refreshTasks) {
        if (closed) return;
        closed = true;
        stopTimers();
        document.getElementById('modal-root').innerHTML = '';
        if (refreshTasks && state.activeTab === 'task') renderTaskTab();
    }
    window.__closeCreateTask = close;

    // ── screen 1: "My Created Tasks" + entry point into the form ──
    async function renderList() {
        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this)this.remove()">

                    <div class="section-title" style="margin-bottom:2px;">📋 Create Task</div>

                    <div id="ct-my-tasks">
                        <div class="skel" style="height:50px; margin:8px 0; border-radius:12px;"></div>

                </div>
            </div>`;
        document.getElementById('ct-new-btn').onclick = renderForm;

        const r = await apiGet(`payments?resource=taskcreate&action=myTasks&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        const body = document.getElementById('ct-my-tasks');
        if (!body) return; // modal closed before this resolved
        if (!r.ok || !r.tasks?.length) {
            body.innerHTML = `<div class="muted" style="font-size:12.5px; text-align:center; padding:10px 0;">You haven't created any tasks yet.</div>`;
            return;
        }
        body.innerHTML = r.tasks.map(t => {
            const limit = t.limit || 0;
            const done = t.completionCount || 0;
            const pct = limit ? Math.min(100, Math.round((done / limit) * 100)) : 0;
            const isDone = limit > 0 && done >= limit;
            // ⚠️ NEW — reviewStatus (see api/bot.js "🕐 Pending Review"). A
            // paid task sits pending_review before it's ever visible to
            // anyone else — show that clearly instead of a misleading 0/N
            // progress bar that looks like it's just waiting for completions.
            if (t.reviewStatus === 'rejected') {
                return `
                <div class="card" style="padding:10px 12px; margin-bottom:8px; opacity:0.7;">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                        <div style="font-size:13px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(t.title)}</div>
                        <div style="font-size:11px; color:var(--error, #E14D4D); flex-shrink:0;">❌ Rejected</div>
                    </div>
                </div>`;
            }
            if (t.reviewStatus === 'pending_review' || !t.isApproved) {
                return `
                <div class="card" style="padding:10px 12px; margin-bottom:8px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                        <div style="font-size:13px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(t.title)}</div>
                        <div style="font-size:11px; color:var(--pending); flex-shrink:0; white-space:nowrap;">⏳ Pending Review</div>
                    </div>
                </div>`;
            }
            return `
            <div class="card" style="padding:10px 12px; margin-bottom:8px;">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                    <div style="font-size:13px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(t.title)}</div>
                    <div class="mono-num" style="font-size:12px; color:${isDone ? 'var(--success)' : 'var(--ink-muted)'}; flex-shrink:0;">${done}/${limit}${isDone ? ' ✅' : ''}</div>
                </div>
                <div style="height:6px; border-radius:4px; background:var(--surface-raised); margin-top:8px; overflow:hidden;">
                    <div style="height:100%; width:${pct}%; background:${isDone ? 'var(--success)' : 'var(--exclusive-hue)'};"></div>

        document.getElementById('modal-root').innerHTML = `

                <div class="sheet anim-in" style="max-height:calc(var(--ovh, 100vh) * 0.88); overflow-y:auto;">

        document.querySelectorAll('[data-vtype]').forEach(b => b.onclick = () => { captureFormFields(); formData.verifyType = b.dataset.vtype; renderForm(); });
        document.querySelectorAll('[data-pkg]').forEach(b => b.onclick = () => { captureFormFields(); formData.package = b.dataset.pkg; renderForm(); });
        document.getElementById('ct-back').onclick = () => { captureFormFields(); renderList(); };
        document.getElementById('ct-submit').onclick = submitForm;
    }

    async function submitForm() {
        captureFormFields();
        formData.title = formData.title.trim();
        if (!formData.title) return toast('Please enter a task title.', 'error');
        if (formData.verifyType === 'api' && !formData.channelUsername.trim()) return toast('Please enter a channel/group username.', 'error');
        if (formData.verifyType === 'link' && !formData.url.trim()) return toast('Please enter a link.', 'error');

        const btn = document.getElementById('ct-submit');
        btn.textContent = 'Creating order...';
        btn.disabled = true;
        const r = await apiPost('payments', {
            resource: 'taskcreate',
            action: 'create',
            package: formData.package,
            title: formData.title,
            verifyType: formData.verifyType,
            channelUsername: formData.channelUsername,
            url: formData.url,
        });
        if (!document.getElementById('ct-submit')) return; // modal closed before this resolved
        if (!r.ok) {
            toast(errorText(r.error), 'error');
            btn.textContent = 'Continue to Payment';
            btn.disabled = false;
            return;
        }
        order = r.order;
        renderPay();

    function renderPay() {
        document.getElementById('modal-root').innerHTML = `

                        <div style="display:flex; gap:8px; align-items:center;">

                            <span style="width:12px; height:12px; border-radius:50%; border:2px solid var(--pending); border-top-color:transparent; display:inline-block; animation:spin 0.8s linear infinite;"></span>
                            Waiting for payment...
                        </div>
                        <div id="ct-countdown" class="muted" style="font-size:11.5px; margin-top:6px;"></div>
                    </div>

                    <button class="btn btn-outline" id="ct-cancel" style="width:100%; margin-top:14px; font-size:12.5px;">Cancel order</button>
                </div>
            </div>`;

        document.getElementById('ct-copy-addr').onclick = () => { navigator.clipboard.writeText(order.address); toast('Address copied!', 'success'); };
        document.getElementById('ct-copy-memo').onclick = () => { navigator.clipboard.writeText(order.memo); toast('Memo copied!', 'success'); };
        document.getElementById('ct-open-tonkeeper').onclick = () => openTonkeeperLink(order.deepLink);
        document.getElementById('ct-cancel').onclick = async () => {
            stopTimers();
            await apiPost('payments', { resource: 'taskcreate', action: 'cancel', orderId: order.id });
            toast('Order cancelled.', 'info');
            close();
        };

        startCountdown();
        startPolling();
    }

    function startCountdown() {
        const expiresAt = new Date(order.expiresAt).getTime();
        const tick = () => {
            const el = document.getElementById('ct-countdown');
            if (!el) { clearInterval(countdownTimer); return; }
            const msLeft = expiresAt - Date.now();
            if (msLeft <= 0) {
                el.textContent = 'Expired';
                clearInterval(countdownTimer);
                return;
            }
            const mm = Math.floor(msLeft / 60000);
            const ss = Math.floor((msLeft % 60000) / 1000);
            el.textContent = `Auto-cancels in ${mm}:${String(ss).padStart(2, '0')} if unpaid`;
        };
        tick();
        countdownTimer = setInterval(tick, 1000);
    }

    function startPolling() {
        pollTimer = setInterval(async () => {
            const s = await apiGet(`payments?resource=taskcreate&action=status&orderId=${order.id}&initData=${encodeURIComponent(TG_INIT_DATA)}`);
            if (!document.getElementById('ct-status-line')) { clearInterval(pollTimer); return; } // modal closed
            if (!s.ok) return; // transient error — just try again next tick
            if (s.status === 'paid') {
                stopTimers();
                triggerBurst(document.getElementById('modal-root'));
                showCongrats('Payment Confirmed!', '⏳');
                toast('Payment confirmed — your task is now pending admin review.', 'success');
                setTimeout(() => close(true), 1200);
            } else if (s.status === 'expired') {
                stopTimers();
                document.getElementById('modal-root').innerHTML = `
                    <div class="overlay" onclick="if(event.target===this)this.remove()">
                        <div class="sheet anim-in">
                            <div class="sheet-handle"></div>
                            <div style="text-align:center; padding:20px 0;">

                                <div style="font-weight:600; margin-bottom:6px;">Order expired</div>
                                <div class="muted" style="font-size:12.5px; margin-bottom:16px;">No payment was received within ${TASK_CREATE_ORDER_EXPIRY_MIN_DISPLAY} minutes.</div>
                                <button class="btn btn-primary" id="ct-retry" style="width:100%;">Try again</button>
                            </div>
                        </div>
                    </div>`;
                document.getElementById('ct-retry').onclick = renderForm;
            }
        }, 4000);
    }

    renderList();
}

    if (splashEl) splashEl.remove();

        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:32px 24px; text-align:center;">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--coin)" stroke-width="2" style="margin-bottom:18px;"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
            <div style="font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--coin);">Connection Problem</div>
            <div class="muted" style="font-size:13.5px; line-height:1.7; margin-top:10px; max-width:320px;">Couldn't reach the server — your connection might be slow or unstable right now.</div>
            <button class="btn btn-primary" id="conn-retry-btn" style="max-width:340px; margin-top:22px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg> Try again
            </button>
        </div>`;
    document.getElementById('conn-retry-btn').onclick = () => { location.reload(); };
}

function showIpInUseScreen(owner) {
    const initials = (owner?.firstName || '?').trim().charAt(0).toUpperCase();
    const handle = owner?.telegramUsername ? `@${owner.telegramUsername}` : 'private';
    document.getElementById('app-root').innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:32px 24px; text-align:center;">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--coin)" stroke-width="2" style="margin-bottom:18px;"><path d="M5 12.5a11 11 0 0114 0M8.5 16a6 6 0 017 0"/><circle cx="12" cy="19.5" r="1.2" fill="var(--coin)" stroke="none"/></svg>
            <div style="font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--coin);">Device Already In Use</div>
            <div class="muted" style="font-size:13.5px; line-height:1.7; margin-top:10px; max-width:320px;">This device is already linked to another account.<br>Log in with that account, or claim this device for this one below.</div>

            <div class="card" style="width:100%; max-width:340px; margin-top:24px; text-align:left; display:flex; align-items:center; gap:12px;">
                <div style="width:42px; height:42px; border-radius:50%; background:var(--coin-soft); color:var(--coin); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--font-display); flex-shrink:0;">${esc(initials)}</div>
                <div style="flex:1; min-width:0;">
                    <div style="font-weight:600; font-size:14px;">${esc(owner?.firstName || 'Unknown user')}</div>
                    <div class="muted" style="font-size:12px;">${esc(handle)} · ID <span class="mono-num">${esc(owner?.id || '—')}</span></div>
                </div>
            </div>

            <button class="btn btn-primary" id="ip-retry-btn" style="max-width:340px; margin-top:22px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg> Try again
            </button>
            <button class="btn btn-outline" id="ip-switch-btn" style="max-width:340px; margin-top:10px;">Switch account (resets my balance)</button>
            <div class="muted" style="font-size:11px; margin-top:14px; max-width:320px; line-height:1.6;">Switching claims this connection for your account but resets your VYRO COIN and USDT balance to zero.</div>
        </div>`;

    document.getElementById('ip-retry-btn').onclick = () => { location.reload(); };
    document.getElementById('ip-switch-btn').onclick = async (e) => {
        const confirmed = await new Promise((resolve) => {
            const msg = tx('This will reset your entire balance to zero. Continue?');
            if (tg?.showConfirm) tg.showConfirm(msg, resolve);
            else resolve(confirm(msg));
        });
        if (!confirmed) return;
        e.target.disabled = true;
        e.target.textContent = 'Switching…';
        const r = await apiPost('user', { action: 'switchAccount', initData: TG_INIT_DATA, fingerprint: await generateDeviceFingerprint() });
        if (r && r.ok) {
            location.reload();
        } else {
            // ⚠️ CHANGED — prefer the friendly r.message (e.g. the new
            // switch_cooldown explanation) over the bare error code.
            toast(r?.message || r?.error || 'Could not switch account', 'error');
            e.target.disabled = false;
            e.target.textContent = 'Switch account (resets my balance)';
        }
    };
}

async function refreshUser() {
    const r = await apiGet(`user?action=profile&initData=${encodeURIComponent(TG_INIT_DATA)}`);
    if (r.ok) {
        state.user = r.user;
        // Ban gate — if user is banned, show ban screen and stop everything
        if (r.user?.isBanned) {
            document.getElementById('app-root').innerHTML = '';
            const appealUrl = `https://t.me/NewTube12_bot?start=appeal_${USER_ID}`;
            document.getElementById('modal-root').innerHTML = `
                <div style="position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;z-index:999;">
                    <div style="font-size:52px;margin-bottom:20px;">⛔</div>
                    <div style="font-family:var(--font-display);font-weight:700;font-size:22px;margin-bottom:12px;">Account Banned</div>
                    <div style="color:var(--ink-muted);font-size:14px;line-height:1.7;margin-bottom:24px;">Your account has been banned for breaking our rules (multiple accounts or cheating).<br><br>If you believe this is a mistake, tap below to request a review from the admin.</div>
                    <a href="${appealUrl}" target="_blank" class="btn btn-primary" style="width:auto; padding:0 22px; text-decoration:none;">🆘 Request Review</a>
                </div>`;
            throw new Error('banned'); // stop further execution in init()
        }
        return;
    }
    // ⚠️ FIX — previously, if r.ok was false (network timeout, 500, cold-start
    // failure, etc.) this function just silently returned with state.user
    // left unset — no error, no retry, nothing. init() would then carry on as
    // if everything succeeded. Now it throws, so init()'s catch block below
    // can show a real "connection failed, tap to retry" screen instead of
    // either hanging or silently rendering a broken/empty app.
    throw new Error(r.error === 'timeout' ? 'connection_timeout' : 'connection_failed');
}

async function init() {
    const splashStart = performance.now();

    // ── Telegram-only gate ── matches the original app's behavior: wait briefly
    // for Telegram's WebApp bridge to deliver initData, and if it never does
    // (because this was opened in a regular browser, not via Telegram), block
    // entirely instead of silently falling back to a fake/demo identity.
    if (!hydrateDisplayUserFields()) {
        await new Promise(r => setTimeout(r, 800));
        if (!hydrateDisplayUserFields()) {
            await new Promise(r => setTimeout(r, 1500));
        }
    }
    if (!TG_INIT_DATA || !hydrateDisplayUserFields()) {
        document.getElementById('splash').remove();
        document.getElementById('app-root').innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:16px; text-align:center; padding:0 30px;">
                <div style="font-size:48px;">📱</div>
                <div style="font-family:var(--font-display); font-weight:700; font-size:17px;">Open this in Telegram</div>
                <div class="muted" style="font-size:13px; line-height:1.6;">VYROVA only works inside the Telegram app. Please open it via the VYROVA bot.</div>
            </div>`;
        return;
    }

    const initRes = await apiPost('user', { action: 'init', fingerprint: await generateDeviceFingerprint() });
    if (initRes && initRes.ok === false && initRes.error === 'ip_in_use') {
        const splashEl = document.getElementById('splash');
        if (splashEl) splashEl.remove();
        showIpInUseScreen(initRes.owner);
        return;
    }
    // ⚠️ FIX — any OTHER init failure (timeout, 500, cold-start DB error, etc.)
    // used to be silently ignored here — execution just carried on into
    // refreshUser() as if init had succeeded. Now any non-ip_in_use failure
    // goes straight to the retry screen instead of limping forward.
    if (!initRes || initRes.ok === false) {
        showConnectionErrorScreen();
        return;
    }
    try {
        await refreshUser();
    } catch (e) {
        if (e.message === 'banned') {
            // Ban screen already shown in refreshUser() — remove splash and stop
            const splash = document.getElementById('splash');
            if (splash) { splash.classList.add('out'); setTimeout(() => splash.remove(), 550); }
            return;
        }
        // ⚠️ FIX — connection_timeout / connection_failed / any other unexpected
        // error now shows a visible retry screen instead of either hanging on
        // the static "92%" splash forever (old timeout-less fetch) or, if it
        // did resolve, silently proceeding with no user data and breaking
        // downstream renders with no explanation to the user.
        showConnectionErrorScreen();
        return;
    }

    // Splash stays for at least 900ms so its entrance animation is always seen,
    // even when the network is fast — avoids an abrupt flash-then-gone feel.
    const elapsed = performance.now() - splashStart;
    if (elapsed < 900) await new Promise(r => setTimeout(r, 900 - elapsed));
    const splash = document.getElementById('splash');
    await VyFX.finishSplash();
    splash.classList.add('out');
    setTimeout(() => splash.remove(), 650);

    showOnboarding(async () => {
        const joinCheck = await apiGet(`user?action=checkJoin&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        if (joinCheck.joined) startApp();
        else showJoinGate({ leftAfterVerifying: joinCheck.leftAfterVerifying }, startApp);
    });
}

function startApp() {
    renderShell();
    switchTab('home');
    startJoinWatcher();
    setTimeout(checkPendingGift, 900); // after the splash/home entrance animation, so the two don't show at once
}

// ⚠️ FIX — pure canvas+screen+locale+timezone+cores fingerprinting collides
// across DIFFERENT physical devices when the hardware/software is common
// (same cheap Android model, same GPU, same Asia/Dhaka timezone, same bn/en
// locale — exactly the typical profile for our user base). That made the
// "device already in use" gate hard-block genuinely different people on
// genuinely different phones, which is what was being reported as false
// account suspensions.
//
// Fix: mix in a random, install-scoped ID that's generated once and
// persisted in localStorage. This is the dominant entropy source now — two
// physically identical phones will still get different fingerprints because
// each one rolled its own random ID on first launch. localStorage clears if
// the user clears app data / reinstalls, which starts a "new device" for
// gating purposes — same trade-off every app with this pattern accepts.
function getOrCreateInstallId() {
    try {
        const KEY = 'nt_install_id';
        let id = localStorage.getItem(KEY);
        if (!id) {
            id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));
            localStorage.setItem(KEY, id);
        }
        return id;
    } catch { return ''; } // localStorage unavailable — falls back to the weaker hardware-only signal below
}

async function generateDeviceFingerprint() {
    try {
        const parts = [];
        parts.push(getOrCreateInstallId()); // dominant entropy source, see note above
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 200; canvas.height = 50;
        ctx.textBaseline = 'top'; ctx.font = '14px Arial'; ctx.fillStyle = '#f60'; ctx.fillRect(0, 0, 100, 20);
        ctx.fillStyle = '#069'; ctx.fillText('VYROVA-fp', 2, 15);
        parts.push(canvas.toDataURL());
        parts.push(screen.width + 'x' + screen.height + 'x' + screen.colorDepth);
        parts.push(navigator.language || '');
        parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
        parts.push(navigator.hardwareConcurrency || '');
        const data = new TextEncoder().encode(parts.join('|||'));
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch { return null; }
}

// ⚠️ NEW — absolute last-resort safety net. If ANY future script (ad SDK or
// otherwise) ever blocks parsing again, or init() throws something not
// caught above, this guarantees the user is never stuck on the static "92%"
// splash forever — after 20s, if the splash is still there, force the
// connection-error/retry screen.
setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash && !splash.classList.contains('out')) showConnectionErrorScreen();
}, 20000);

init();
</script>
